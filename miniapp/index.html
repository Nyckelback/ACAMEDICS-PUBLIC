<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <title>ACAMEDICS — Justificación</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;500;600;700&family=Source+Sans+3:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,500&family=Nunito+Sans:ital,wght@0,300;0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        @font-face { font-family: 'Neue Kabel'; src: local('Neue Kabel'), local('ITC Kabel'); }
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            color-scheme: light dark;
            --primary: #18828C;
            --primary-dark: #126A72;
            --primary-glow: rgba(24,130,140,0.10);
            --primary-subtle: rgba(24,130,140,0.04);
            --accent: #C84677;
            --accent-subtle: rgba(200,70,119,0.06);

            --navy: #0F172A;
            --navy-soft: #1E293B;
            --slate: #334155;
            --text: #1A1A2E;
            --text-body: #333333;
            --text-muted: #94A3B8;
            --border: #E2E8F0;
            --bg: #FFFFFF;

            --font-title: 'Neue Kabel', 'Josefin Sans', 'Helvetica Neue', sans-serif;
            --font-body: 'Source Sans 3', -apple-system, BlinkMacSystemFont, sans-serif;
            --font-size-base: 16px;
        }

        /* ═══════════════════════════════════════════
           DARK THEME
        ═══════════════════════════════════════════ */
        [data-theme="dark"] {
            --bg: #161616;
            --navy: #FFFFFF;
            --navy-soft: #FFFFFF;
            --slate: #E0E0E0;
            --text: #FFFFFF;
            --text-body: #ECECEC;
            --text-muted: #8A8A8A;
            --border: #2A2A2A;

            --primary: #20A4B0;
            --primary-dark: #18828C;
            --primary-glow: rgba(32,164,176,0.18);
            --primary-subtle: rgba(32,164,176,0.08);
            --accent: #E05A8D;
            --accent-subtle: rgba(224,90,141,0.10);
        }
        /* answer-section uses CSS vars, auto-adapts to dark mode */
        [data-theme="dark"] .tip-section { background: rgba(32,164,176,0.06); }
        [data-theme="dark"] .tip-text { border-left-color: var(--primary); }
        [data-theme="dark"] .bib-item { border-bottom-color: rgba(255,255,255,0.06); }
        [data-theme="dark"] .footer { border-top-color: var(--border); }
        .header-logo-text {
            font-family: var(--font-title);
            font-size: 14px; font-weight: 400;
            color: var(--navy);
            letter-spacing: -0.3px;
            margin-top: 2px;
        }
        /* Logo ACAMEDICS: se aclaran los tonos en modo noche para que no se pierda */
        [data-theme="dark"] .header-birrete .brr-1 { fill: #3FD3DB; }
        [data-theme="dark"] .header-birrete .brr-4 { fill: #2AA3AC; }
        [data-theme="dark"] .header-birrete .brr-2 { fill: #1F7C85; }
        [data-theme="dark"] .header-birrete .brr-3 { fill: #1A6B72; }
        [data-theme="dark"] .scroll-top { box-shadow: 0 2px 14px rgba(0,0,0,0.5); }
        [data-theme="dark"] .img-toggle-count { background: var(--border); color: var(--slate); }
        [data-theme="dark"] .motivation-text { color: #BDBDBD; }
        [data-theme="dark"] .footer-logo-text { color: #BDBDBD; opacity: 0.6; }
        [data-theme="dark"] .footer-link { color: #BDBDBD; }
        [data-theme="dark"] .footer-copy { color: #BDBDBD; opacity: 0.5; }
        [data-theme="dark"] .divider--primary { background: var(--border); }
        [data-theme="dark"] .bottom-bar { background: linear-gradient(90deg, #333, var(--primary), var(--accent)); }
        [data-theme="dark"] .lightbox { background: rgba(0,0,0,0.96); }

        html, body {
            background: var(--bg) !important; color: var(--text) !important;
            font-family: var(--font-body); font-size: var(--font-size-base);
            line-height: 1.6; overflow-x: hidden;
            -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
            -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
        }

        .app { max-width: 640px; margin: 0 auto; padding: 0 12px 12px; }

        /* ═══════════════════════════════════════════
           LOADING & ERROR
        ═══════════════════════════════════════════ */
        .loading-container { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 80vh; gap: 16px; }
        .spinner { width: 40px; height: 40px; border: 3px solid var(--primary); border-top-color: transparent; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-text { font-size: 14px; color: var(--text-muted); text-align: center; }
        .error-container { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 80vh; gap: 16px; padding: 20px; }
        .error-icon { font-size: 40px; }
        .error-text { font-size: 14px; color: var(--text-muted); text-align: center; }
        .retry-btn { background: var(--primary); color: #fff; border: none; padding: 10px 24px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; }

        /* ═══════════════════════════════════════════
           HEADER
        ═══════════════════════════════════════════ */
        .header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 18px 0 14px;
        }
        .header-left { display: flex; align-items: center; gap: 6px; }
        .header-birrete { width: 24px; height: 24px; flex-shrink: 0; }
        .header-birrete svg { width: 100%; height: 100%; display: block; }
        .header-logo { height: 17px; width: auto; display: block; }
        .header-divider { width: 1px; height: 14px; background: var(--border); }
        .header-case {
            font-family: var(--font-title);
            font-size: 11px; font-weight: 600;
            color: var(--primary); text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-top: 2px;
        }

        /* ═══════════════════════════════════════════
           DIVIDER
        ═══════════════════════════════════════════ */
        .divider { height: 1px; background: var(--border); }
        /* Cierre del header: una linea fina de borde a borde, como en cualquier
           barra de app. Antes era un degradado teal que se desvanecia: llamaba la
           atencion sin separar nada y se leia como adorno. */
        .divider--primary {
            height: 1px;
            margin: 0 -12px;
            background: var(--border);
        }

        /* ═══════════════════════════════════════════
           HERO SECTION — title + answer
        ═══════════════════════════════════════════ */
        .hero { padding: 24px 0 28px; }

        /* la etiqueta va pegada a lo que etiqueta, no flotando lejos */
        .eyebrow-row {
            display: flex; align-items: center; justify-content: space-between;
            gap: 12px; margin-bottom: 12px;
        }
        .eyebrow-row .hero-title { margin-bottom: 0; }

        .ctrl-btns { display: flex; gap: 6px; flex-shrink: 0; }
        button, .font-btn, .theme-btn { touch-action: manipulation; }
        .font-btn, .theme-btn {
            border: 1.5px solid var(--border); background: var(--bg);
            font-family: var(--font-title); font-size: 13px; font-weight: 500;
            color: var(--text-muted); cursor: pointer;
            width: 32px; height: 32px; border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.2s; flex-shrink: 0;
            -webkit-tap-highlight-color: transparent;
        }
        .font-btn:active, .font-btn.active,
        .theme-btn:active, .theme-btn.active {
            border-color: var(--primary); color: var(--primary);
        }
        .theme-btn svg { width: 16px; height: 16px; }
        .theme-btn .icon-sun,
        .theme-btn .icon-moon { display: none; }
        .theme-btn .icon-moon { display: block; }
        [data-theme="dark"] .theme-btn .icon-moon { display: none; }
        [data-theme="dark"] .theme-btn .icon-sun { display: block; }

        /* Etiqueta de seccion, con el mismo estilo que "RESPUESTA CORRECTA":
           antes era un titulo de 20px que competia con el diagnostico. */
        .hero-title {
            font-family: var(--font-title);
            font-size: 11px; font-weight: 600;
            color: var(--text-muted);
            line-height: 1.4;
            letter-spacing: 1.2px;
            margin-bottom: 0;
            text-transform: uppercase;
        }
        .hero-title br { display: none; }

        /* Answer callout */
        /* Chips de especialidad / sistema, al estilo de las apps de casos clinicos */
        .chips {
            display: flex; flex-wrap: wrap; gap: 7px;
            padding: 16px 0 0;
        }
        .chip {
            font-family: var(--font-title);
            font-size: 10px; font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase; letter-spacing: 0.9px;
            padding: 5px 11px;
            border: 1px solid var(--border);
            border-radius: 999px;
            white-space: nowrap;
        }
        .chip:first-child { color: var(--primary); border-color: var(--primary); }

        /* ── Bloque de revision: solo aparece si published=false ──
           Es andamiaje de trabajo, no parte del diseno publicado: por eso va
           en un tono distinto y con su etiqueta, para no confundirlo con el caso. */
        .revision {
            margin: 18px -12px 0;
            padding: 16px 20px 18px;
            background: rgba(127,127,127,0.07);
            border-top: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
        }
        .revision-tag {
            font-family: var(--font-title);
            font-size: 10px; font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase; letter-spacing: 1.2px;
            margin-bottom: 12px;
        }
        .revision-vineta {
            font-family: var(--font-body);
            font-size: calc(var(--font-size-base) - 2px);
            color: var(--text-body);
            line-height: 1.55;
        }
        .revision-vineta p { margin-bottom: 10px; }
        .revision-vineta p:last-child { margin-bottom: 0; }
        .revision-ops { list-style: none; margin: 14px 0 0; padding: 0; }
        .revision-ops li {
            display: flex; align-items: flex-start; gap: 9px;
            padding: 7px 9px;
            border-radius: 7px;
            font-family: var(--font-body);
            font-size: calc(var(--font-size-base) - 2px);
            color: var(--text-body);
            line-height: 1.45;
        }
        .revision-ops li.ok {
            background: var(--primary-subtle);
            color: var(--navy);
        }
        .rop-letra {
            font-family: var(--font-title);
            font-weight: 700; color: var(--text-muted);
            min-width: 14px; flex-shrink: 0;
        }
        .revision-ops li.ok .rop-letra { color: var(--primary); }
        .rop-texto { flex: 1; }
        .rop-marca {
            font-family: var(--font-title);
            font-size: 9px; font-weight: 700;
            color: var(--primary);
            text-transform: uppercase; letter-spacing: 1px;
            padding-top: 3px; flex-shrink: 0;
        }

        /* La respuesta como en las apps de casos clinicos: etiqueta pequena
           arriba y el diagnostico grande como protagonista. */
        .answer-section {
            background: var(--primary-subtle);
            padding: 18px 20px 20px;
            margin: 0 -12px;
        }
        .answer-label {
            display: flex; align-items: center; gap: 6px;
            font-family: var(--font-title);
            font-size: 11px; font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase; letter-spacing: 1.2px;
            margin-bottom: 8px;
        }
        .answer-check { width: 15px; height: 15px; color: var(--primary); flex-shrink: 0; }
        .answer-text {
            font-family: var(--font-title);
            font-size: 22px; font-weight: 600;
            color: var(--primary);
            line-height: 1.25;
            letter-spacing: -0.01em;
        }

        /* Iconos Phosphor: van rellenos, no con trazo */
        .font-btn svg, .theme-btn svg, .img-chevron, .bib-chevron,
        .img-toggle-icon svg, .scroll-top svg, .lb-btn svg, .footer-link svg {
            fill: currentColor; stroke: none;
        }
        .font-btn svg { width: 17px; height: 17px; }

        /* ═══════════════════════════════════════════
           JUSTIFICATION
        ═══════════════════════════════════════════ */
        .justification-section { padding: 20px 0 24px; }

        .justification {
            font-family: var(--font-body);
            font-size: calc(var(--font-size-base) - 2px);
            color: var(--text-body);
            line-height: 1.6;
            text-align: left;
            transition: font-size 0.2s ease;
        }
        /* Todos los parrafos comparten la misma sangria para que el texto quede
           alineado: el primero (con drop cap) y los de vineta empiezan igual. */
        .justification p {
            /* El espacio entre parrafos debe superar la altura de linea,
               si no, los parrafos se funden y el bloque se ve apretado. */
            margin-bottom: 26px;
            position: relative;
        }
        .justification p:last-child { margin-bottom: 0; }
        .justification b { font-weight: 700; }

        /* La vineta marca UNICAMENTE los descartes (una opcion incorrecta cada uno).
           Los parrafos de la correcta van sin vineta, sean 1, 2 o 3. */
        .justification p.descarte { padding-left: 18px; }
        .justification p.descarte::before {
            content: "";
            position: absolute;
            left: 2px;
            top: 0.66em;
            width: 5px; height: 5px;
            border-radius: 1px;
            background: var(--primary);
        }

        /* Separador entre la explicacion de la correcta y los descartes:
           una linea corta y centrada, sin texto. */
        .just-sep {
            margin: 28px auto 24px;
            width: 44%;
            height: 1px;
            background: var(--border);
        }
        .just-sep span { display: none; }

        /* Drop cap */
        .justification p:first-child::first-letter {
            font-family: var(--font-title);
            font-size: 3em;
            color: var(--accent);
            font-weight: 700;
            float: left;
            line-height: 0.8;
            margin-right: 8px;
            margin-top: 5px;
        }

        /* ═══════════════════════════════════════════
           TIP SECTION
        ═══════════════════════════════════════════ */
        .tip-section {
            padding: 0;
            background: var(--primary-subtle);
            margin: 0 -12px;
        }
        .tip-accent-bar {
            height: 3px;
            background: linear-gradient(90deg, var(--primary), var(--accent));
        }
        .tip-inner { padding: 24px 20px 24px; }
        .tip-header {
            display: flex; align-items: center; gap: 10px;
            margin-bottom: 16px;
        }
        .tip-icon {
            width: 30px; height: 30px;
            border-radius: 8px;
            background: var(--primary-glow);
            display: flex; align-items: center; justify-content: center;
            font-size: 15px;
        }
        .tip-label {
            font-family: var(--font-title);
            font-size: 14px; font-weight: 700;
            color: var(--navy);
            letter-spacing: 0.3px;
        }
        .tip-label-accent { color: var(--primary); }
        .tip-text {
            font-family: var(--font-body);
            font-size: var(--font-size-base);
            color: var(--text-body);
            line-height: 1.32;
            padding-left: 16px;
            border-left: 3px solid var(--primary);
            text-align: left;
        }

        /* ═══════════════════════════════════════════
           IMAGES ACCORDION
        ═══════════════════════════════════════════ */
        .img-accordion { margin: 24px 0 0; }
        .img-toggle {
            width: 100%; background: none; border: none;
            padding: 0 0 16px;
            display: flex; align-items: center; justify-content: space-between;
            cursor: pointer;
        }
        .img-toggle-left { display: flex; align-items: center; gap: 10px; }
        .img-toggle-icon {
            width: 26px; height: 26px;
            border-radius: 7px; background: var(--primary-glow);
            display: flex; align-items: center; justify-content: center;
        }
        .img-toggle-icon svg { width: 14px; height: 14px; color: var(--primary); }
        .img-toggle-text {
            font-family: var(--font-title);
            font-size: 12px; font-weight: 600;
            color: var(--slate);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .img-toggle-count {
            font-family: var(--font-body);
            font-size: 11px; color: var(--text-muted);
            background: var(--border); padding: 2px 8px; border-radius: 10px;
        }
        .img-chevron {
            width: 18px; height: 18px;
            color: var(--text-muted);
            transition: transform 0.3s;
        }
        .img-accordion.open .img-chevron { transform: rotate(180deg); }
        .img-content {
            max-height: 0; overflow: hidden;
            transition: max-height 0.4s ease;
        }
        .img-accordion.open .img-content { max-height: 3000px; }
        .img-content img {
            width: 100%; border-radius: 10px;
            margin-bottom: 12px; cursor: pointer;
            -webkit-user-drag: none;
            transition: transform 0.2s;
        }
        .img-content img:active { transform: scale(0.98); }

        /* Lightbox */
        .lightbox {
            display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.92); z-index: 1000;
            align-items: center; justify-content: center; flex-direction: column;
            overflow: hidden; touch-action: none;
        }
        .lightbox.active { display: flex; }
        .lightbox img {
            max-width: 100%; max-height: 100%;
            object-fit: contain;
            transform-origin: center center;
            will-change: transform;
            -webkit-user-drag: none;
            transition: transform 0.18s ease-out;
        }
        .lightbox.dragging img { transition: none; }
        /* Botonera superior del visor */
        .lb-bar {
            position: absolute; top: 0; left: 0; right: 0;
            display: flex; align-items: center; justify-content: space-between;
            padding: 14px 16px; gap: 10px; z-index: 2;
            background: linear-gradient(180deg, rgba(0,0,0,0.55), transparent);
        }
        .lb-btn {
            width: 40px; height: 40px; border-radius: 50%;
            background: rgba(255,255,255,0.16); border: none;
            color: #fff; cursor: pointer; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
            -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
        }
        .lb-btn:active { background: rgba(255,255,255,0.3); }
        .lb-btn svg { width: 20px; height: 20px; }
        .lb-right { display: flex; gap: 10px; }
        .lb-zoom {
            font-family: var(--font-body); font-size: 12px; font-weight: 600;
            color: rgba(255,255,255,0.85); min-width: 46px; text-align: center;
        }
        .lightbox-hint {
            position: absolute; bottom: 22px; left: 0; right: 0; text-align: center;
            color: rgba(255,255,255,0.55); font-size: 12px; z-index: 2;
            font-family: var(--font-body); pointer-events: none;
            transition: opacity 0.25s;
        }
        .lightbox.zoomed .lightbox-hint { opacity: 0; }

        /* ═══════════════════════════════════════════
           BIBLIOGRAPHY
        ═══════════════════════════════════════════ */
        .bib-section { padding: 24px 0 0; }
        .bib-toggle {
            width: 100%; background: none; border: none;
            padding: 0 0 16px;
            display: flex; align-items: center; justify-content: space-between;
            cursor: pointer;
        }
        .bib-toggle-left { display: flex; align-items: center; gap: 10px; }
        .bib-toggle-num {
            font-family: var(--font-title);
            font-size: 13px; font-weight: 600;
            color: var(--primary);
            width: 26px; height: 26px;
            border-radius: 7px;
            background: var(--primary-glow);
            display: flex; align-items: center; justify-content: center;
        }
        .bib-toggle-text {
            font-family: var(--font-title);
            font-size: 12px; font-weight: 600;
            color: var(--slate);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .bib-chevron {
            width: 18px; height: 18px;
            color: var(--text-muted);
            transition: transform 0.3s;
        }
        .bib-section.open .bib-chevron { transform: rotate(180deg); }
        .bib-content {
            max-height: 0; overflow: hidden;
            transition: max-height 0.35s ease;
        }
        .bib-section.open .bib-content { max-height: 800px; }
        .bib-list { padding: 0 0 8px; }
        .bib-item {
            display: flex; gap: 10px; align-items: flex-start;
            padding: 10px 0;
            border-bottom: 1px solid rgba(226,232,240,0.5);
        }
        .bib-item:last-child { border-bottom: none; }
        .bib-num {
            font-family: var(--font-title);
            font-size: 12px; font-weight: 600;
            color: var(--primary);
            min-width: 16px; padding-top: 2px;
        }
        .bib-ref {
            font-family: var(--font-body);
            font-size: 13px; color: var(--slate);
            line-height: 1.55;
        }

        /* ═══════════════════════════════════════════
           FOOTER
        ═══════════════════════════════════════════ */
        .footer {
            margin-top: 28px;
            padding: 18px 0 8px;
            border-top: 1px solid var(--border);
            text-align: center;
        }
        .motivation {
            position: relative;
            margin-bottom: 14px;
            padding: 0 16px;
        }
        .motivation-icon {
            position: absolute;
            left: 2px; top: 0;
            font-size: 11px;
        }
        .motivation-text {
            font-family: var(--font-body);
            font-size: 12px;
            font-style: italic;
            color: var(--text-muted);
            line-height: 1.5;
            text-align: center;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .footer-logo { text-align: center; margin-bottom: 12px; }
        .footer-logo-text {
            font-family: var(--font-title);
            font-size: 13px; font-weight: 400;
            color: var(--text-muted);
            opacity: 0.45; letter-spacing: -0.3px;
        }
        .footer-social {
            display: flex; justify-content: center; gap: 20px;
            margin-bottom: 8px;
        }
        .footer-link {
            display: flex; align-items: center; gap: 5px;
            text-decoration: none;
            font-family: var(--font-title);

    <button class="scroll-top" id="scrollTop"><svg viewBox="0 0 256 256" fill="currentColor" xmlns="http://www.w3.org/2000/svg"><path d="M205.66,117.66a8,8,0,0,1-11.32,0L136,59.31V216a8,8,0,0,1-16,0V59.31L61.66,117.66a8,8,0,0,1-11.32-11.32l72-72a8,8,0,0,1,11.32,0l72,72A8,8,0,0,1,205.66,117.66Z"/></svg></button>
    <div class="bottom-bar"></div>

    <script>
        // ─── Theme: sun/moon toggle (starts from system preference) ───
        const themeMql = window.matchMedia('(prefers-color-scheme: dark)');
        let savedTheme = null;
        try { savedTheme = localStorage.getItem('acamedics-theme'); } catch(e) {}

        function applyTheme(theme) {
            if (theme === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
            } else {
                document.documentElement.removeAttribute('data-theme');
            }
        }
        function getEffective() {
            if (savedTheme) return savedTheme;
            return themeMql.matches ? 'dark' : 'light';
        }
        themeMql.addEventListener('change', () => {
            if (!savedTheme) applyTheme(themeMql.matches ? 'dark' : 'light');
        });
        applyTheme(getEffective());

        let tg = null;
        try {
            tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
            if (tg) { tg.ready(); tg.expand(); if (tg.disableVerticalSwipes) tg.disableVerticalSwipes(); }
        } catch(e) { console.warn('Telegram WebApp SDK not available'); }
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('selectstart', e => e.preventDefault());
        document.addEventListener('dragstart', e => e.preventDefault());

        const contentDiv = document.getElementById('content');

        // ─── Haptic feedback ───
        function haptic(style) {
            try {
                if (tg && tg.HapticFeedback) {
                    tg.HapticFeedback.impactOccurred(style || 'light');
                    return;
                }
            } catch(e) {}
            try { navigator.vibrate && navigator.vibrate(style === 'medium' ? 15 : 8); } catch(e) {}
        }

        // ─── Motivational phrases ───
        const phrases = [
            // ── Clásicos verificados ──
            { text: "El médico que solo sabe de medicina, ni de medicina sabe.", author: "José de Letamendi" },
            { text: "La medicina es la ciencia de la incertidumbre y el arte de la probabilidad.", author: "William Osler" },
            { text: "Donde quiera que se ama el arte de la medicina, se ama también a la humanidad.", author: "Platón" },
            { text: "El buen médico trata la enfermedad; el gran médico trata al paciente que tiene la enfermedad.", author: "William Osler" },
            { text: "La paciencia es la mejor medicina.", author: "John Florio" },
            { text: "El acto médico es un acto de amor.", author: "Gregorio Marañón" },
            { text: "El médico competente, antes de dar una medicina, primero diagnostica la enfermedad.", author: "Cicerón" },
            { text: "La función del médico es entretener al paciente mientras la naturaleza cura la enfermedad.", author: "Voltaire" },
            { text: "La excelencia no es un acto, sino un hábito.", author: "Aristóteles" },
            { text: "Curar a veces, aliviar con frecuencia, consolar siempre.", author: "Hipócrates" },
            { text: "La vida es breve, el arte largo, la ocasión fugaz, la experiencia engañosa, el juicio difícil.", author: "Hipócrates" },
            { text: "No hay enfermedades, sino enfermos.", author: "Gregorio Marañón" },
            { text: "El secreto de la atención del paciente está en interesarse por el paciente.", author: "Francis Peabody" },
            { text: "La medicina es una ciencia social, y la política no es más que medicina a gran escala.", author: "Rudolf Virchow" },
            { text: "Escucha al paciente; él te está diciendo el diagnóstico.", author: "William Osler" },
            { text: "El que estudia la medicina sin los libros navega sin brújula; pero el que la estudia sin pacientes no navega.", author: "William Osler" },
            { text: "La primera obligación del médico es educar a las masas para que no necesiten de él.", author: "Santiago Ramón y Cajal" },
            { text: "Todo hombre puede ser, si se lo propone, escultor de su propio cerebro.", author: "Santiago Ramón y Cajal" },
            { text: "No hay hechos pequeños. Lo que llamamos pequeño es simplemente algo que no entendemos.", author: "Santiago Ramón y Cajal" },
            { text: "La clínica es soberana.", author: "Aforismo médico" },
            { text: "Primum non nocere: ante todo, no hacer daño.", author: "Principio hipocrático" },

            { text: "En nada se parece tanto el médico a Dios como en el deseo de ayudar al prójimo.", author: "Maimónides" },
            { text: "Quien salva una vida, salva al mundo entero.", author: "Talmud" },
            { text: "Los médicos no solo deben conocer la enfermedad, sino también al ser humano.", author: "Rudolf Virchow" },
            { text: "La medicina no es solo una ciencia, es también un arte. No se trata solo de pastillas y pociones.", author: "Paracelso" },
            { text: "El investigador sufre las decepciones, los largos meses pasados en una dirección equivocada, pero llega.", author: "Santiago Ramón y Cajal" },
            { text: "Siempre que enseñes, enseña también a dudar de lo que enseñas.", author: "José Ortega y Gasset" },
            // ── Motivacionales para el estudio ──
            { text: "Estudia, porque el día menos pensado alguien dependerá de lo que tú sabes.", author: "Anónimo" },
            { text: "No estudies para aprobar. Estudia para saber. Y cuando sepas, no podrás reprobar.", author: "Anónimo" },
            { text: "Cada paciente que atiendes es un libro que te enseña algo nuevo.", author: "Anónimo" },
            { text: "El éxito en medicina se construye caso a caso, día a día.", author: "Anónimo" }
        ];
        function getPhrase() { return phrases[Math.floor(Math.random() * phrases.length)]; }

        // ─── Utility functions ───
        function stripBibPrefix(t) { return t.replace(/^\s*(\d+[\.\)\-\]]\s*|\[\d+\]\s*|-\s*|•\s*|–\s*|►\s*|>\s*)/,'').trim(); }

        // ── Filtros de bibliografia ──────────────────────────────────────
        // Descartan lo que NO es una referencia real. Actuan al mostrar, asi que
        // tambien corrigen casos ya publicados sin tener que volver a subirlos.

        // 1) Encabezados de seccion que se cuelan como si fueran una referencia
        const BIB_ENCABEZADOS = /^(bibliograf[ií]a|referencias?(\s+bibliogr[aá]ficas?)?|fuentes?|citas?(\s+bibliogr[aá]ficas?)?|lecturas?\s+recomendadas?|material\s+de\s+consulta|bibliography|references?|sources?|refs?)\s*:?\s*$/i;

        // 2) Bancos de preguntas que NO deben aparecer citados (regla ACAMEDICS)
        const BIB_PROHIBIDAS = /\b(amboss|uworld|nbme|usmle[\s-]*rx|usmle|quesmed|kaplan|osmosis|lecturio|truelearn|archer\s+review|mir\b|enarm)\b/i;

        function esReferenciaValida(s) {
            const t = (s || '').trim();
            if (t.length < 12) return false;
            if (BIB_ENCABEZADOS.test(t)) return false;          // "BIBLIOGRAFÍA" sola
            if (BIB_PROHIBIDAS.test(t)) return false;           // AMBOSS, UWorld, etc.
            if (/^tip\s+acam[eé]dico/i.test(t)) return false;   // el TIP mal ubicado
            if (t.includes('**')) return false;                 // prosa con negritas: es justificacion, no referencia
            return true;
        }

        // ── Rescate de contenido mal ubicado ─────────────────────────────
        // Cuando un caso llega mal partido (le pasa a los largos enviados por
        // Telegram), parte de la justificacion y el TIP terminan guardados dentro
        // de la bibliografia. NO se descartan: se devuelven a su sitio, porque son
        // texto que el autor escribio y el estudiante debe leer.
        function rescatarContenido(d) {
            const bruto = [];
            const b = d && d.bibliography;
            if (Array.isArray(b)) b.forEach(x => { if (typeof x === 'string') x.split('\n').forEach(l => bruto.push(l)); });
            else if (typeof b === 'string') b.split('\n').forEach(l => bruto.push(l));
            else return d;

            const prosa = [], tips = [];
            bruto.forEach(linea => {
                const t = (linea || '').trim();
                if (t.length < 12) return;
                if (/^tip\s+acam[eé]dico/i.test(t)) { tips.push(t.replace(/^tip\s+acam[eé]dico\s*:?\s*/i, '')); return; }
                // parrafo de justificacion: lleva negritas y no parece una cita
                if (t.includes('**') && !/doi:|https?:\/\//i.test(t)) prosa.push(t);
            });
            if (!prosa.length && !tips.length) return d;

            const copia = Object.assign({}, d);
            if (prosa.length) copia.justification = (copia.justification || '').trimEnd() + '\n\n' + prosa.join('\n\n');
            if (tips.length && !(copia.tip || '').trim()) copia.tip = tips.join(' ');
            return copia;
        }

        function parseBibliography(bib) {
            let bruto = [];
            if (Array.isArray(bib) && bib.length > 0) {
                if (bib.length === 1 && bib[0].includes('\n')) {
                    bruto = bib[0].split('\n');
                } else {
                    bib.forEach(item => {
                        if (typeof item !== 'string') return;
                        if (item.includes('\n')) item.split('\n').forEach(s => bruto.push(s));
                        else bruto.push(item);
                    });
                }
            } else if (typeof bib === 'string') {
                bruto = bib.split('\n');
            }
            return bruto.map(s => (s || '').trim()).filter(esReferenciaValida);
        }

        function esc(s) { if (!s) return ''; const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
        function mdBold(s) {
            // Fix misplaced bold markers: letter**rest** → **letter rest**
            // Catches 1-3 letters before ** that should be inside the bold
            s = s.replace(/(^|[\s(,;:])([a-zA-ZáéíóúñüÁÉÍÓÚÑÜ]{1,3})\*\*([^\*]+?)\*\*/g, '$1**$2$3**');
            // Convert **text** to <b>text</b> AFTER esc() so it's safe
            // Also convert *text* (single) to <i>text</i> for italic
            return s
                .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
                .replace(/(?<!\*)\*(?!\*)(.+?)(?<!\*)\*(?!\*)/g, '<i>$1</i>');
        }

        // ─── Load case from Supabase ───
        async function loadCase() {
            try {
                let caseId = new URLSearchParams(window.location.search).get('case');
                if (!caseId && tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param) {

                if (!caseId && new URLSearchParams(window.location.hash.replace('#','?')).get('tgWebAppStartParam')) {
                    caseId = new URLSearchParams(window.location.hash.replace('#','?')).get('tgWebAppStartParam');
                }
                // Solo en pruebas locales: si no hay ?case=, carga un caso de ejemplo
                // para poder ver el diseño al instante. En Telegram/produccion NUNCA entra aqui.

                    caseId = 'fea66128-a654-4a84-bf9e-4c83f9ca117c';
                }
                if (!caseId) { showError('No se especificó caso clínico'); return; }
                const ak = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh1eGV3enplcWdsdWltZm1pZ2pzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI2NjYwMjcsImV4cCI6MjA4ODI0MjAyN30.fDyK2PwJCpCOi8axSNw_hmFRe5tSxyptoErWIpS2JLQ';
                const base = 'https://xuxewzzeqgluimfmigjs.supabase.co/rest/v1';
                const h = { 'apikey': ak, 'Content-Type': 'application/json' };
                const cr = await fetch(base+'/cases?id=eq.'+caseId+'&select=*', {headers:h});
                if (!cr.ok) throw new Error('fetch error');
                const cases = await cr.json();
                if (!cases.length) { showError('Caso clínico no encontrado'); return; }

        // ─── Render case with new design ───
        // Generate a consistent display number (1000-3000) from UUID
        function caseDisplayNum(uuid) {
            if (!uuid) return 1000;
            let hash = 0;
            for (let i = 0; i < uuid.length; i++) {
                hash = ((hash << 5) - hash) + uuid.charCodeAt(i);
                hash |= 0;
            }
            return 1000 + (Math.abs(hash) % 2001); // 1000–3000
        }

        function renderCase(d) {

            const phrase = getPhrase();
            const caseNum = caseDisplayNum(d.id || '');
            let html = '';

            // ── HEADER ──
            html += '<div class="header">';
            html += '<div class="header-left">';
            html += '<div class="header-birrete"><svg viewBox="0 0 180 180" xmlns="http://www.w3.org/2000/svg"><path class="brr-3" fill="#0e4247" d="m145.66,87.07h0s0-3.1,0-3.1l-49.57,22.81c-3.85,1.78-8.31,1.76-12.16-.01l-49.57-22.89v3.2h0s0,0,0,0v37.58c.5-.03,1-.03,1.51-.03,7.65,0,15.02,1.18,21.96,3.37.05.01.1.03.15.04,10.18,2.88,21.86,8.56,31.13,19.7.04.03.91,1.11.91,1.11,0,0,.87-1.09.91-1.11,9.36-11.24,21.16-16.94,31.4-19.79.05-.01.11-.03.18-.05,6.84-2.12,14.13-3.27,21.67-3.27.5,0,.99,0,1.49.03v-29.77h0v-7.81Z"/><path class="brr-4" fill="#18757e" d="m139.52,117.84s-34.94,3.42-49.52,31.01c0,0-12.19-28.82-55.65-29.38v-32.39l40.97,26.28c7.73,4.96,17.45,5.83,25.86,2.12.15-.07,38.33-17.75,38.33-17.75v20.12Z"/><path class="brr-1" fill="#1ba8af" d="m85.97,31.98L1,66.09l83.37,38.36c3.57,1.64,7.68,1.64,11.25,0l83.37-38.36L94.03,31.98c-2.57-1.11-5.48-1.11-8.05,0Z"/><path class="brr-4" fill="#18757e" d="m95.63,104.45c-6.05,2.78-11.25,0-11.25,0L1,66.09v4.75s0,.13.01.19c.07.58.43,1.09.97,1.34l80.81,37.56c4.57,2.13,9.85,2.13,14.43,0l80.81-37.56c.54-.25.9-.76.97-1.34h0c0-.13.01-.26.01-.39v-4.56l-83.37,38.36Z"/><path class="brr-2" fill="#12585f" d="m163.85,122.56l3.45,20.74h-12.2l3.77-20.59c-2.21-.92-3.77-3.1-3.77-5.64s1.56-4.71,3.77-5.65l.04-36.1-61.56-6.93c-1.44,1.36-4.3,2.21-7.55,2.06-4.6-.21-8.23-2.34-8.12-4.75,0-.14.03-.28.06-.42.08-.36.25-.7.49-1.02,0,0,0,0,0,0,1.23-1.64,4.36-2.7,7.98-2.54,3.92.18,7.14,1.76,7.93,3.71l65.64,7.65-.03,38.46c2.09.97,3.54,3.06,3.54,5.53s-1.4,4.51-3.45,5.48Z"/></svg></div>';
            html += '<span class="header-logo-text">ACAMEDICS</span>';

            html += '<span class="header-case">Caso #'+esc(String(caseNum))+'</span>';
            html += '</div>';
            // Los controles viven en la barra superior, no al lado del titulo:
            // asi el titulo queda solo, a todo el ancho, y la cabecera se lee de un golpe.
            html += '<div class="ctrl-btns">';
            html += '<button class="font-btn" id="fontCycle" title="Tamaño de letra"><svg viewBox="0 0 256 256" fill="currentColor" xmlns="http://www.w3.org/2000/svg"><path d="M87.24,52.59a8,8,0,0,0-14.48,0l-64,136a8,8,0,1,0,14.48,6.81L39.9,160h80.2l16.66,35.4a8,8,0,1,0,14.48-6.81ZM47.43,144,80,74.79,112.57,144ZM200,96c-12.76,0-22.73,3.47-29.63,10.32a8,8,0,0,0,11.26,11.36c3.8-3.77,10-5.68,18.37-5.68,13.23,0,24,9,24,20v3.22A42.76,42.76,0,0,0,200,128c-22.06,0-40,16.15-40,36s17.94,36,40,36a42.73,42.73,0,0,0,24-7.25,8,8,0,0,0,16-.75V132C240,112.15,222.06,96,200,96Zm0,88c-13.23,0-24-9-24-20s10.77-20,24-20,24,9,24,20S213.23,184,200,184Z"/></svg></button>';
            html += '<button class="theme-btn" id="themeToggle" title="Cambiar tema">';
            html += '<svg class="icon-moon" viewBox="0 0 256 256" fill="currentColor" xmlns="http://www.w3.org/2000/svg"><path d="M233.54,142.23a8,8,0,0,0-8-2,88.08,88.08,0,0,1-109.8-109.8,8,8,0,0,0-10-10,104.84,104.84,0,0,0-52.91,37A104,104,0,0,0,136,224a103.09,103.09,0,0,0,62.52-20.88,104.84,104.84,0,0,0,37-52.91A8,8,0,0,0,233.54,142.23ZM188.9,190.34A88,88,0,0,1,65.66,67.11a89,89,0,0,1,31.4-26A106,106,0,0,0,96,56,104.11,104.11,0,0,0,200,160a106,106,0,0,0,14.92-1.06A89,89,0,0,1,188.9,190.34Z"/></svg>';
            html += '<svg class="icon-sun" viewBox="0 0 256 256" fill="currentColor" xmlns="http://www.w3.org/2000/svg"><path d="M120,40V16a8,8,0,0,1,16,0V40a8,8,0,0,1-16,0Zm72,88a64,64,0,1,1-64-64A64.07,64.07,0,0,1,192,128Zm-16,0a48,48,0,1,0-48,48A48.05,48.05,0,0,0,176,128ZM58.34,69.66A8,8,0,0,0,69.66,58.34l-16-16A8,8,0,0,0,42.34,53.66Zm0,116.68-16,16a8,8,0,0,0,11.32,11.32l16-16a8,8,0,0,0-11.32-11.32ZM192,72a8,8,0,0,0,5.66-2.34l16-16a8,8,0,0,0-11.32-11.32l-16,16A8,8,0,0,0,192,72Zm5.66,114.34a8,8,0,0,0-11.32,11.32l16,16a8,8,0,0,0,11.32-11.32ZM48,128a8,8,0,0,0-8-8H16a8,8,0,0,0,0,16H40A8,8,0,0,0,48,128Zm80,80a8,8,0,0,0-8,8v24a8,8,0,0,0,16,0V216A8,8,0,0,0,128,208Zm112-88H216a8,8,0,0,0,0,16h24a8,8,0,0,0,0-16Z"/></svg>';
            html += '</button></div>';
            html += '</div>';

            // ── PRIMARY DIVIDER ──

            // ── CHIPS de especialidad / sistema ──

            if (tags.length) {

                    html += '<span class="chip">' + esc(String(t).trim()) + '</span>';

                html += '</div>';

            // ── BLOQUE DE REVISION (solo mientras el caso NO esta publicado) ──
            // Deja ver la viñeta y las opciones para verificar el caso completo
            // antes de mandarlo al canal. Al publicarse desaparece solo.
            if (d.published === false && (d.vignette || (d.options || []).length)) {
                html += '<div class="revision">';
                html += '<div class="revision-tag">Vista previa · solo tú ves esto</div>';
                if (d.vignette) {
                    const vparas = String(d.vignette).split(/\n\s*\n/).filter(p => p.trim());
                    html += '<div class="revision-vineta">';
                    vparas.forEach(p => { html += '<p>' + mdBold(esc(p.trim())) + '</p>'; });
                    html += '</div>';
                }
                const ops = Array.isArray(d.options) ? d.options : [];
                if (ops.length) {
                    html += '<ul class="revision-ops">';
                    ops.forEach(o => {
                        const esCorrecta = (o.letter || '').toUpperCase() === (d.correct_letter || '').toUpperCase();
                        html += '<li class="' + (esCorrecta ? 'ok' : '') + '">'
                             +    '<span class="rop-letra">' + esc(o.letter || '') + '</span>'
                             +    '<span class="rop-texto">' + esc(o.text || '') + '</span>'
                             +    (esCorrecta ? '<span class="rop-marca">correcta</span>' : '')
                             +  '</li>';
                    });
                    html += '</ul>';
                }
                html += '</div>';
            }

            // ── HERO: title + answer ──
            html += '<div class="hero">';
            html += '<div class="eyebrow-row">';
            html += '<h2 class="hero-title">Análisis y fundamentación del caso clínico</h2>';
            html += '</div>';
            if (d.correct_letter && d.correct_text) {
                html += '<div class="answer-section">';
                html += '<div class="answer-label">' + "<svg class=\"answer-check\" viewBox=\"0 0 256 256\" fill=\"currentColor\" xmlns=\"http://www.w3.org/2000/svg\"><path d=\"M128,24A104,104,0,1,0,232,128,104.11,104.11,0,0,0,128,24Zm45.66,85.66-56,56a8,8,0,0,1-11.32,0l-24-24a8,8,0,0,1,11.32-11.32L112,148.69l50.34-50.35a8,8,0,0,1,11.32,11.32Z\"/></svg>" + 'Respuesta correcta</div>';
                html += '<div class="answer-text">'+esc(d.correct_text)+'</div>';
                html += '</div>';
            }
            html += '</div>';

            // ── DIVIDER ──
            html += '<div class="divider"></div>';

            // ── JUSTIFICATION ──
            if (d.justification) {
                html += '<div class="justification-section">';
                html += '<div class="justification" id="justText">';

                let justText = d.justification;
                // Fix option-letter references in justification text
                justText = justText.replace(/((?:opci[oó]n|respuesta|alternativa|inciso|literal|la|el|\()\s*)\n\s*([A-Fa-f][.),:]\s*)/gi, '$1$2');
                justText = justText.replace(/\n\s*([A-Fa-f][.)]\s+[a-záéíóúñ])/g, ' $1');
                justText = justText.replace(/\n\s*(\(?[A-Fa-f][.)]\)?)\s*\n/g, ' $1 ');

                const hasDoubleNL = /\n\s*\n/.test(justText);
                let paras;
                if (hasDoubleNL) {
                    paras = justText.split(/\n\s*\n/).filter(p=>p.trim());
                } else {
                    paras = justText.split(/\n/).filter(p=>p.trim());
                }
                // ── Donde termina la CORRECTA y empiezan los descartes ──────────
                // Tres senales, de mas fiable a menos. La correcta puede ocupar varios
                // parrafos, asi que nunca se asume "el primero y ya".
                //   1. El titulo "¿Por que no las otras?" (lo genera publish.py)
                //   2. Un parrafo que arranca con "**B. Texto de la opcion**"
                //   3. Una linea ---  (escape manual para casos escritos a mano)
                // Si no aparece ninguna, no se marca nada: mejor callar que inventar
                // una estructura que no se conoce.
                const esTituloOtras = t => /^\**\s*¿?\s*por\s+qu[ée]\s+no\s+(las\s+)?(otras|dem[áa]s)/i.test(t);
                const esRaya        = t => /^\s*([-*_])\1{2,}\s*$/.test(t);
                const abreDescarte  = t => /^\*\*\s*[A-F][.)]\s/.test(t);
                let enDescartes = false;

                paras.forEach(p => {
                    const merged = p.split('\n').map(l=>l.trim()).filter(l=>l).join(' ');
                    if (esTituloOtras(merged) || esRaya(merged)) {
                        enDescartes = true;
                        html += '<div class="just-sep"><span>¿Por qué no las <i>otras</i>?</span></div>';
                        return;
                    }
                    if (abreDescarte(merged) && !enDescartes) {
                        // primer descarte sin titulo previo: se abre la seccion igual
                        enDescartes = true;
                        html += '<div class="just-sep"><span>¿Por qué no las <i>otras</i>?</span></div>';
                    }
                    let parHtml = mdBold(esc(merged));
                    // Deja en negrita SOLO la primera de cada párrafo (lo realmente relevante);
                    // las demás se muestran en texto normal. Para desactivar: borrar este bloque.
                    let primera = true;
                    parHtml = parHtml.replace(/<b>([\s\S]*?)<\/b>/g, (m, dentro) => {
                        if (primera) { primera = false; return m; }
                        return dentro;
                    });
                    html += '<p'+(enDescartes ? ' class="descarte"' : '')+'>'+parHtml+'</p>';
                });
                html += '</div></div>';
            }

            // ── TIP SECTION (full-bleed) ──
            if (d.tip) {
                html += '<div class="tip-section">';
                html += '<div class="tip-accent-bar"></div>';
                html += '<div class="tip-inner">';
                html += '<div class="tip-header">';
                html += '<div class="tip-icon">💡</div>';
                html += '<span class="tip-label">Tip <span class="tip-label-accent">ACAMÉDICO</span></span>';
                html += '</div>';
                html += '<div class="tip-text">'+mdBold(esc(d.tip))+'</div>';
                html += '</div></div>';
            }

            // ── IMAGES ACCORDION ──
            const caseImages = Array.isArray(d.images) ? d.images : [];
            if (caseImages.length) {
                html += '<div class="img-accordion open" id="imgAccordion">';
                html += '<button class="img-toggle" id="imgToggle">';
                html += '<div class="img-toggle-left">';
                html += '<div class="img-toggle-icon"><svg viewBox="0 0 256 256" fill="currentColor" xmlns="http://www.w3.org/2000/svg"><path d="M216,40H40A16,16,0,0,0,24,56V200a16,16,0,0,0,16,16H216a16,16,0,0,0,16-16V56A16,16,0,0,0,216,40Zm0,16V158.75l-26.07-26.06a16,16,0,0,0-22.63,0l-20,20-44-44a16,16,0,0,0-22.62,0L40,149.37V56ZM40,172l52-52,80,80H40Zm176,28H194.63l-36-36,20-20L216,181.38V200ZM144,100a12,12,0,1,1,12,12A12,12,0,0,1,144,100Z"/></svg></div>';
                html += '<span class="img-toggle-text">Recurso Adicional</span>';
                html += '<span class="img-toggle-count">'+caseImages.length+'</span>';
                html += '</div>';
                html += '<svg class="img-chevron" viewBox="0 0 256 256" fill="currentColor" xmlns="http://www.w3.org/2000/svg"><path d="M213.66,101.66l-80,80a8,8,0,0,1-11.32,0l-80-80A8,8,0,0,1,53.66,90.34L128,164.69l74.34-74.35a8,8,0,0,1,11.32,11.32Z"/></svg>';
                html += '</button>';
                html += '<div class="img-content">';
                caseImages.forEach((url,i) => {
                    if(url && typeof url === 'string')
                        html += '<img src="'+esc(url)+'" alt="Recurso '+(i+1)+'" loading="lazy" data-full="'+esc(url)+'">';
                });
                html += '</div></div>';
            }

            // ── BIBLIOGRAPHY ACCORDION ──
            const bibRefs = parseBibliography(d.bibliography);
            if (bibRefs.length > 0) {
                html += '<div class="bib-section" id="bibSection">';
                html += '<button class="bib-toggle" id="bibToggle">';
                html += '<div class="bib-toggle-left">';
                html += '<div class="bib-toggle-num">'+bibRefs.length+'</div>';
                html += '<span class="bib-toggle-text">Referencias bibliográficas</span>';
                html += '</div>';
                html += '<svg class="bib-chevron" viewBox="0 0 256 256" fill="currentColor" xmlns="http://www.w3.org/2000/svg"><path d="M213.66,101.66l-80,80a8,8,0,0,1-11.32,0l-80-80A8,8,0,0,1,53.66,90.34L128,164.69l74.34-74.35a8,8,0,0,1,11.32,11.32Z"/></svg>';
                html += '</button>';
                html += '<div class="bib-content"><div class="bib-list">';
                bibRefs.forEach((r,i) => {
                    html += '<div class="bib-item">';
                    html += '<span class="bib-num">'+(i+1)+'.</span>';
                    html += '<span class="bib-ref">'+esc(stripBibPrefix(r))+'</span>';
                    html += '</div>';
                });
                html += '</div></div></div>';
            }

            // ── FOOTER ──
            html += '<div class="footer">';
            // Motivational phrase
            html += '<div class="motivation">';
            html += '<span class="motivation-icon">✨</span>';
            html += '<span class="motivation-text">"'+esc(phrase.text)+'" — '+esc(phrase.author)+'</span>';
            html += '</div>';
            // Logo
            html += '<div class="footer-logo">';
            html += '<span class="footer-logo-text">ACAMEDICS</span>';
            html += '</div>';
            // Social
            html += '<div class="footer-social">';
            html += '<a href="https://instagram.com/acamedics.co" target="_blank" rel="noopener" class="footer-link">';
            html += '<svg viewBox="0 0 256 256" fill="currentColor" xmlns="http://www.w3.org/2000/svg"><path d="M128,80a48,48,0,1,0,48,48A48.05,48.05,0,0,0,128,80Zm0,80a32,32,0,1,1,32-32A32,32,0,0,1,128,160ZM176,24H80A56.06,56.06,0,0,0,24,80v96a56.06,56.06,0,0,0,56,56h96a56.06,56.06,0,0,0,56-56V80A56.06,56.06,0,0,0,176,24Zm40,152a40,40,0,0,1-40,40H80a40,40,0,0,1-40-40V80A40,40,0,0,1,80,40h96a40,40,0,0,1,40,40ZM192,76a12,12,0,1,1-12-12A12,12,0,0,1,192,76Z"/></svg>';
            html += '@acamedics.co</a>';
            html += '<a href="#" class="footer-link" id="tgScrollTop">';
            html += '<svg viewBox="0 0 256 256" fill="currentColor" xmlns="http://www.w3.org/2000/svg"><path d="M228.88,26.19a9,9,0,0,0-9.16-1.57L17.06,103.93a14.22,14.22,0,0,0,2.43,27.21L72,141.45V200a15.92,15.92,0,0,0,10,14.83,15.91,15.91,0,0,0,17.51-3.73l25.32-26.26L165,220a15.88,15.88,0,0,0,10.51,4,16.3,16.3,0,0,0,5-.79,15.85,15.85,0,0,0,10.67-11.63L231.77,35A9,9,0,0,0,228.88,26.19Zm-61.14,36L78.15,126.35l-49.6-9.73ZM88,200V152.52l24.79,21.74Zm87.53,8L92.85,135.5l119-85.29Z"/></svg>';
            html += '@acamedics_co</a>';
            html += '</div>';
            // Copyright
            html += '<div class="footer-copy">&copy; '+new Date().getFullYear()+' ACAMEDICS. Todos los derechos reservados.</div>';
            html += '</div>';

            // ── LIGHTBOX ──
            html += '<div class="lightbox" id="lightbox">'
                 +    '<div class="lb-bar">'
                 +      '<button class="lb-btn" id="lightboxClose" title="Cerrar"><svg viewBox="0 0 256 256" fill="currentColor" xmlns="http://www.w3.org/2000/svg"><path d="M205.66,194.34a8,8,0,0,1-11.32,11.32L128,139.31,61.66,205.66a8,8,0,0,1-11.32-11.32L116.69,128,50.34,61.66A8,8,0,0,1,61.66,50.34L128,116.69l66.34-66.35a8,8,0,0,1,11.32,11.32L139.31,128Z"/></svg></button>'
                 +      '<span class="lb-zoom" id="lbZoom">100%</span>'
                 +      '<div class="lb-right">'
                 +        '<button class="lb-btn" id="lbReset" title="Restablecer zoom"><svg viewBox="0 0 256 256" fill="currentColor" xmlns="http://www.w3.org/2000/svg"><path d="M224,128a96,96,0,0,1-94.71,96H128A95.38,95.38,0,0,1,62.1,197.8a8,8,0,0,1,11-11.63A80,80,0,1,0,71.43,71.39a3.07,3.07,0,0,1-.26.25L44.59,96H72a8,8,0,0,1,0,16H24a8,8,0,0,1-8-8V56a8,8,0,0,1,16,0V85.8L60.25,60A96,96,0,0,1,224,128Z"/></svg></button>'
                 +        '<button class="lb-btn" id="lbDownload" title="Descargar"><svg viewBox="0 0 256 256" fill="currentColor" xmlns="http://www.w3.org/2000/svg"><path d="M224,144v64a8,8,0,0,1-8,8H40a8,8,0,0,1-8-8V144a8,8,0,0,1,16,0v56H208V144a8,8,0,0,1,16,0Zm-101.66,5.66a8,8,0,0,0,11.32,0l40-40a8,8,0,0,0-11.32-11.32L136,124.69V32a8,8,0,0,0-16,0v92.69L93.66,98.34a8,8,0,0,0-11.32,11.32Z"/></svg></button>'
                 +      '</div>'
                 +    '</div>'
                 +    '<img id="lightboxImg" src="" alt="">'
                 +    '<div class="lightbox-hint">Pellizca para acercar · doble toque · arrastra para mover</div>'
                 +  '</div>';

            contentDiv.innerHTML = html;

            // ── Event listeners ──
            // Bibliography accordion
            const bt = document.getElementById('bibToggle');
            if (bt) bt.addEventListener('click', () => { haptic('light'); document.getElementById('bibSection').classList.toggle('open'); });

            // Images accordion
            const it = document.getElementById('imgToggle');
            if (it) it.addEventListener('click', () => { haptic('light'); document.getElementById('imgAccordion').classList.toggle('open'); });

            // ── Lightbox con zoom, arrastre y descarga ──
            const lb = document.getElementById('lightbox');
            const lbImg = document.getElementById('lightboxImg');
            const lbZoomLabel = document.getElementById('lbZoom');
            const MIN_Z = 1, MAX_Z = 6;
            let z = 1, tx = 0, ty = 0;              // escala y desplazamiento
            let srcUrl = '';

            function aplicar() {
                lbImg.style.transform = 'translate(' + tx + 'px,' + ty + 'px) scale(' + z + ')';
                lbZoomLabel.textContent = Math.round(z * 100) + '%';
                lb.classList.toggle('zoomed', z > 1.02);
            }
            function limitar() {
                // no dejar que la imagen se salga por completo de la pantalla
                const r = lbImg.getBoundingClientRect();
                const w = lbImg.offsetWidth * z, h = lbImg.offsetHeight * z;
                const maxX = Math.max(0, (w - window.innerWidth) / 2);
                const maxY = Math.max(0, (h - window.innerHeight) / 2);
                tx = Math.min(maxX, Math.max(-maxX, tx));
                ty = Math.min(maxY, Math.max(-maxY, ty));
            }
            function reset() { z = 1; tx = 0; ty = 0; aplicar(); }

            document.querySelectorAll('.img-content img').forEach(img => {
                img.addEventListener('click', () => {
                    haptic('light');
                    srcUrl = img.getAttribute('data-full') || img.src;
                    lbImg.src = srcUrl;
                    reset();
                    lb.classList.add('active');
                });
            });

            const closeLb = () => { haptic('light'); lb.classList.remove('active'); reset(); };
            document.getElementById('lightboxClose').addEventListener('click', closeLb);
            document.getElementById('lbReset').addEventListener('click', () => { haptic('light'); reset(); });

            // Descargar en calidad original
            document.getElementById('lbDownload').addEventListener('click', async () => {
                haptic('medium');
                let nombre = (srcUrl.split('/').pop() || 'acamedics.jpg').split('?')[0];
                // El bot sube sin content-type, asi que Supabase las marca text/plain:
                // se corrige el tipo aqui segun la extension para que el archivo baje bien.
                const ext = (nombre.split('.').pop() || 'jpg').toLowerCase();
                const tipos = { jpg:'image/jpeg', jpeg:'image/jpeg', png:'image/png',
                                webp:'image/webp', heic:'image/heic', gif:'image/gif' };
                try {
                    const resp = await fetch(srcUrl);
                    const crudo = await resp.blob();
                    const blob = new Blob([crudo], { type: tipos[ext] || 'image/jpeg' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url; a.download = nombre;
                    document.body.appendChild(a); a.click(); a.remove();
                    setTimeout(() => URL.revokeObjectURL(url), 4000);
                } catch (e) {
                    window.open(srcUrl, '_blank');   // respaldo: abrir en pestaña nueva
                }
            });

            // --- gestos tactiles: pellizco, arrastre, doble toque ---
            let punteros = new Map(), distIni = 0, zIni = 1, arrastrando = false, ultX = 0, ultY = 0;
            let ultimoToque = 0;

            lbImg.addEventListener('pointerdown', e => {
                punteros.set(e.pointerId, { x: e.clientX, y: e.clientY });
                lbImg.setPointerCapture(e.pointerId);
                if (punteros.size === 1) {
                    arrastrando = true; ultX = e.clientX; ultY = e.clientY;
                    lb.classList.add('dragging');
                } else if (punteros.size === 2) {
                    const p = [...punteros.values()];
                    distIni = Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y);
                    zIni = z; arrastrando = false;
                }
            });
            lbImg.addEventListener('pointermove', e => {
                if (!punteros.has(e.pointerId)) return;
                punteros.set(e.pointerId, { x: e.clientX, y: e.clientY });
                if (punteros.size === 2) {
                    const p = [...punteros.values()];
                    const d = Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y);
                    if (distIni > 0) {
                        z = Math.min(MAX_Z, Math.max(MIN_Z, zIni * (d / distIni)));
                        limitar(); aplicar();
                    }
                } else if (arrastrando && z > 1.02) {
                    tx += e.clientX - ultX; ty += e.clientY - ultY;
                    ultX = e.clientX; ultY = e.clientY;
                    limitar(); aplicar();
                }
            });
            function soltar(e) {
                punteros.delete(e.pointerId);
                if (punteros.size === 0) {
                    arrastrando = false;
                    lb.classList.remove('dragging');
                    if (z <= 1.02) reset();       // vuelve a encuadrar
                }
                if (punteros.size < 2) distIni = 0;
            }
            lbImg.addEventListener('pointerup', soltar);
            lbImg.addEventListener('pointercancel', soltar);

            // doble toque / doble clic: acercar o restablecer
            lbImg.addEventListener('click', e => {
                const ahora = Date.now();
                if (ahora - ultimoToque < 300) {
                    haptic('light');
                    if (z > 1.02) { reset(); }
                    else {
                        z = 2.5;
                        const r = lbImg.getBoundingClientRect();
                        tx = (r.left + r.width / 2 - e.clientX) * (z - 1);
                        ty = (r.top + r.height / 2 - e.clientY) * (z - 1);
                        limitar(); aplicar();
                    }
                    ultimoToque = 0;
                } else {
                    ultimoToque = ahora;
                }
            });

            // rueda del mouse (escritorio)
            lb.addEventListener('wheel', e => {
                e.preventDefault();
                z = Math.min(MAX_Z, Math.max(MIN_Z, z * (e.deltaY < 0 ? 1.12 : 0.89)));
                if (z <= 1.02) { tx = 0; ty = 0; }
                limitar(); aplicar();
            }, { passive: false });

            // tocar el fondo cierra, pero solo si no hay zoom (para no interrumpir el arrastre)
            lb.addEventListener('click', e => {
                if (e.target === lb && z <= 1.02) closeLb();
            });

            // Telegram link: scroll to top
            const tgLink = document.getElementById('tgScrollTop');
            if (tgLink) tgLink.addEventListener('click', e => { e.preventDefault(); haptic('light'); window.scrollTo({top: 0, behavior: 'smooth'}); });

            // Font size cycle: [-2, 0, 2, 4]
            const sizes = [-2, 0, 2, 4];
            let sizeIdx = 1; // start at 0 offset (15px)
            const fc = document.getElementById('fontCycle');
            if (fc) fc.addEventListener('click', e => {
                e.stopPropagation();
                haptic('medium');
                sizeIdx = (sizeIdx + 1) % sizes.length;
                const newSize = 15 + sizes[sizeIdx];
                document.documentElement.style.setProperty('--font-size-base', newSize + 'px');
                fc.classList.toggle('active', sizeIdx !== 1);
            });

            // Theme toggle: simple sun/moon flip
            const tt = document.getElementById('themeToggle');
            if (tt) tt.addEventListener('click', e => {
                e.stopPropagation();
                haptic('medium');
                savedTheme = getEffective() === 'dark' ? 'light' : 'dark';
                try { localStorage.setItem('acamedics-theme', savedTheme); } catch(ex) {}
                applyTheme(savedTheme);
            });
        }

        // Scroll to top button
        const scrollBtn = document.getElementById('scrollTop');
        window.addEventListener('scroll', () => {
            scrollBtn.classList.toggle('visible', window.scrollY > 400);
        }, { passive: true });
        scrollBtn.addEventListener('click', () => {
            haptic('light');
            window.scrollTo({top: 0, behavior: 'smooth'});
        });

        function showError(m) {
            contentDiv.innerHTML = '<div class="error-container"><div class="error-icon">⚠️</div><div class="error-text">'+m+'</div><button class="retry-btn" onclick="location.reload()">Reintentar</button></div>';
        }

        loadCase();
    </script>
</body>
</html>
