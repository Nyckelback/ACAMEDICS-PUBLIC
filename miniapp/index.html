<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <title>ACAMEDICS — Justificación</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;500;600;700&family=Source+Sans+3:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,500&family=Nunito+Sans:ital,wght@0,300;0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        @font-face { font-family: 'Neue Kabel'; src: local('Neue Kabel'), local('ITC Kabel'); }
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            color-scheme: light dark;
            --primary: #18828C;
            --primary-dark: #126A72;
            --primary-glow: rgba(24,130,140,0.10);
            --primary-subtle: rgba(24,130,140,0.04);
            --accent: #C84677;
            --accent-subtle: rgba(200,70,119,0.06);

            --navy: #0F172A;
            --navy-soft: #1E293B;
            --slate: #334155;
            --text: #1A1A2E;
            --text-body: #333333;
            --text-muted: #94A3B8;
            --border: #E2E8F0;
            --bg: #FFFFFF;

            --font-title: 'Neue Kabel', 'Josefin Sans', 'Helvetica Neue', sans-serif;
            --font-body: 'Source Sans 3', -apple-system, BlinkMacSystemFont, sans-serif;
            --font-size-base: 16px;
        }

        /* ═══════════════════════════════════════════
           DARK THEME
        ═══════════════════════════════════════════ */
        [data-theme="dark"] {
            --bg: #161616;
            --navy: #FFFFFF;
            --navy-soft: #FFFFFF;
            --slate: #E0E0E0;
            --text: #FFFFFF;
            --text-body: #ECECEC;
            --text-muted: #8A8A8A;
            --border: #2A2A2A;

            --primary: #20A4B0;
            --primary-dark: #18828C;
            --primary-glow: rgba(32,164,176,0.18);
            --primary-subtle: rgba(32,164,176,0.08);
            --accent: #E05A8D;
            --accent-subtle: rgba(224,90,141,0.10);
        }
        /* answer-section uses CSS vars, auto-adapts to dark mode */
        [data-theme="dark"] .tip-section { background: rgba(32,164,176,0.06); }
        [data-theme="dark"] .tip-text { border-left-color: var(--primary); }
        [data-theme="dark"] .bib-item { border-bottom-color: rgba(255,255,255,0.06); }
        [data-theme="dark"] .footer { border-top-color: var(--border); }
        .header-logo-text {
            font-family: var(--font-title);
            font-size: 14px; font-weight: 400;
            color: var(--navy);
            letter-spacing: -0.3px;
            margin-top: 2px;
        }
        /* Logo ACAMEDICS: se aclaran los tonos en modo noche para que no se pierda */
        [data-theme="dark"] .header-birrete .brr-1 { fill: #3FD3DB; }
        [data-theme="dark"] .header-birrete .brr-4 { fill: #2AA3AC; }
        [data-theme="dark"] .header-birrete .brr-2 { fill: #1F7C85; }
        [data-theme="dark"] .header-birrete .brr-3 { fill: #1A6B72; }
        [data-theme="dark"] .scroll-top { box-shadow: 0 2px 14px rgba(0,0,0,0.5); }
        [data-theme="dark"] .img-toggle-count { background: var(--border); color: var(--slate); }
        [data-theme="dark"] .motivation-text { color: #BDBDBD; }
        [data-theme="dark"] .footer-logo-text { color: #BDBDBD; opacity: 0.6; }
        [data-theme="dark"] .footer-link { color: #BDBDBD; }
        [data-theme="dark"] .footer-copy { color: #BDBDBD; opacity: 0.5; }
        [data-theme="dark"] .divider--primary { background: var(--border); }
        [data-theme="dark"] .bottom-bar { background: linear-gradient(90deg, #333, var(--primary), var(--accent)); }
        [data-theme="dark"] .lightbox { background: rgba(0,0,0,0.96); }

        html, body {
            background: var(--bg) !important; color: var(--text) !important;
            font-family: var(--font-body); font-size: var(--font-size-base);
            line-height: 1.6; overflow-x: hidden;
            -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
            -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* 16px es el margen lateral estandar en movil (iOS HIG y Material) */
        .app { max-width: 640px; margin: 0 auto; padding: 0 16px 12px; }

        /* ═══════════════════════════════════════════
           LOADING & ERROR
        ═══════════════════════════════════════════ */
        .loading-container { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 80vh; gap: 16px; }
        .spinner { width: 40px; height: 40px; border: 3px solid var(--primary); border-top-color: transparent; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-text { font-size: 14px; color: var(--text-muted); text-align: center; }
        .error-container { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 80vh; gap: 16px; padding: 20px; }
        .error-icon { font-size: 40px; }
        .error-text { font-size: 14px; color: var(--text-muted); text-align: center; }
        .retry-btn { background: var(--primary); color: #fff; border: none; padding: 10px 24px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; }

        /* ═══════════════════════════════════════════
           HEADER
        ═══════════════════════════════════════════ */
        .header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 18px 0 14px;
        }
        .header-left { display: flex; align-items: center; gap: 6px; }
        .header-birrete { width: 24px; height: 24px; flex-shrink: 0; }
        .header-birrete svg { width: 100%; height: 100%; display: block; }
        .header-logo { height: 17px; width: auto; display: block; }
        .header-divider { width: 1px; height: 14px; background: var(--border); }
        .header-case {
            font-family: var(--font-title);
            font-size: 11px; font-weight: 600;
            color: var(--primary); text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-top: 2px;
        }

        /* ═══════════════════════════════════════════
           DIVIDER
        ═══════════════════════════════════════════ */
        .divider { height: 1px; background: var(--border); }
        /* Cierre del header: una linea fina de borde a borde, como en cualquier
           barra de app. Antes era un degradado teal que se desvanecia: llamaba la
           atencion sin separar nada y se leia como adorno. */
        .divider--primary {
            height: 1px;
            margin: 0 -16px;
            background: var(--border);
        }

        /* ═══════════════════════════════════════════
           HERO SECTION — title + answer
        ═══════════════════════════════════════════ */
        .hero { padding: 24px 0 28px; }

        /* la etiqueta va pegada a lo que etiqueta, no flotando lejos */
        .eyebrow-row {
            display: flex; align-items: center; justify-content: space-between;
            gap: 12px; margin-bottom: 12px;
        }
        .eyebrow-row .hero-title { margin-bottom: 0; }

        .ctrl-btns { display: flex; gap: 6px; flex-shrink: 0; }
        button, .font-btn, .theme-btn { touch-action: manipulation; }
        .font-btn, .theme-btn {
            border: 1.5px solid var(--border); background: var(--bg);
            font-family: var(--font-title); font-size: 13px; font-weight: 500;
            color: var(--text-muted); cursor: pointer;
            width: 32px; height: 32px; border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.2s; flex-shrink: 0;
            -webkit-tap-highlight-color: transparent;
        }
        .font-btn:active, .font-btn.active,
        .theme-btn:active, .theme-btn.active {
            border-color: var(--primary); color: var(--primary);
        }
        .theme-btn svg { width: 16px; height: 16px; }
        .theme-btn .icon-sun,
        .theme-btn .icon-moon { display: none; }
        .theme-btn .icon-moon { display: block; }
        [data-theme="dark"] .theme-btn .icon-moon { display: none; }
        [data-theme="dark"] .theme-btn .icon-sun { display: block; }

        /* Etiqueta de seccion, con el mismo estilo que "RESPUESTA CORRECTA":
           antes era un titulo de 20px que competia con el diagnostico. */
        .hero-title {
            font-family: var(--font-title);
            font-size: 11px; font-weight: 600;
            color: var(--text-muted);
            line-height: 1.4;
            letter-spacing: 1.2px;
            margin-bottom: 0;
            text-transform: uppercase;
        }
        .hero-title br { display: none; }

        /* Answer callout */
        /* Chips de especialidad / sistema, al estilo de las apps de casos clinicos */
        .chips {
            display: flex; flex-wrap: wrap; gap: 7px;
            padding: 16px 0 0;
        }
        .chip {
            font-family: var(--font-title);
            font-size: 10px; font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase; letter-spacing: 0.9px;
            padding: 5px 11px;
            border: 1px solid var(--border);
            border-radius: 999px;
            white-space: nowrap;
        }
        .chip:first-child { color: var(--primary); border-color: var(--primary); }

        /* ── Bloque de revision: solo aparece si published=false ──
           Es andamiaje de trabajo, no parte del diseno publicado: por eso va
           en un tono distinto y con su etiqueta, para no confundirlo con el caso. */
        .revision {
            margin: 18px -12px 0;
            padding: 16px 20px 18px;
            background: rgba(127,127,127,0.07);
            border-top: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
        }
        .revision-tag {
            font-family: var(--font-title);
            font-size: 10px; font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase; letter-spacing: 1.2px;
            margin-bottom: 12px;
        }
        .revision-vineta {
            font-family: var(--font-body);
            font-size: calc(var(--font-size-base) - 2px);
            color: var(--text-body);
            line-height: 1.55;
        }
        .revision-vineta p { margin-bottom: 10px; }
        .revision-vineta p:last-child { margin-bottom: 0; }
        .revision-ops { list-style: none; margin: 14px 0 0; padding: 0; }
        .revision-ops li {
            display: flex; align-items: flex-start; gap: 9px;
            padding: 7px 9px;
            border-radius: 7px;
            font-family: var(--font-body);
            font-size: calc(var(--font-size-base) - 2px);
            color: var(--text-body);
            line-height: 1.45;
        }
        .revision-ops li.ok {
            background: var(--primary-subtle);
            color: var(--navy);
        }
        .rop-letra {
            font-family: var(--font-title);
            font-weight: 700; color: var(--text-muted);
            min-width: 14px; flex-shrink: 0;
        }
        .revision-ops li.ok .rop-letra { color: var(--primary); }
        .rop-texto { flex: 1; }
        .rop-marca {
            font-family: var(--font-title);
            font-size: 9px; font-weight: 700;
            color: var(--primary);
            text-transform: uppercase; letter-spacing: 1px;
            padding-top: 3px; flex-shrink: 0;
        }

        /* La respuesta como en las apps de casos clinicos: etiqueta pequena
           arriba y el diagnostico grande como protagonista. */
        .answer-section {
            background: var(--primary-subtle);
            padding: 18px 20px 20px;
            margin: 0 -16px;
        }
        .answer-label {
            display: flex; align-items: center; gap: 6px;
            font-family: var(--font-title);
            font-size: 11px; font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase; letter-spacing: 1.2px;
            margin-bottom: 8px;
        }
        .answer-check { width: 15px; height: 15px; color: var(--primary); flex-shrink: 0; }
        .answer-text {
            font-family: var(--font-title);
            font-size: 22px; font-weight: 600;
            color: var(--primary);
            line-height: 1.25;
            letter-spacing: -0.01em;
        }

        /* Iconos Phosphor: van rellenos, no con trazo */
        .font-btn svg, .theme-btn svg, .img-chevron, .bib-chevron,
        .img-toggle-icon svg, .scroll-top svg, .lb-btn svg, .footer-link svg {
            fill: currentColor; stroke: none;
        }
        .font-btn svg { width: 17px; height: 17px; }

        /* ═══════════════════════════════════════════
           JUSTIFICATION
        ═══════════════════════════════════════════ */
        .justification-section { padding: 20px 0 24px; }

        .justification {
            font-family: var(--font-body);
            font-size: calc(var(--font-size-base) - 2px);
            color: var(--text-body);
            line-height: 1.6;
            text-align: left;
            transition: font-size 0.2s ease;
        }
        /* Todos los parrafos comparten la misma sangria para que el texto quede
           alineado: el primero (con drop cap) y los de vineta empiezan igual. */
        .justification p {
            /* El espacio entre parrafos debe superar la altura de linea,
               si no, los parrafos se funden y el bloque se ve apretado. */
            margin-bottom: 26px;
            position: relative;
        }
        .justification p:last-child { margin-bottom: 0; }
        .justification b { font-weight: 700; }

        /* La vineta marca UNICAMENTE los descartes (una opcion incorrecta cada uno).
           Los parrafos de la correcta van sin vineta, sean 1, 2 o 3. */
        .justification p.descarte { padding-left: 18px; }
        .justification p.descarte::before {
            content: "";
            position: absolute;
            left: 2px;
            top: 0.66em;
            width: 5px; height: 5px;
            border-radius: 1px;
            background: var(--primary);
        }

        /* Separador entre la explicacion de la correcta y los descartes:
           una linea corta y centrada, sin texto. */
        .just-sep {
            margin: 28px auto 24px;
            width: 44%;
            height: 1px;
            background: var(--border);
        }
        .just-sep span { display: none; }

        /* Drop cap */
        .justification p:first-child::first-letter {
            font-family: var(--font-title);
            font-size: 3em;
            color: var(--accent);
            font-weight: 700;
            float: left;
            line-height: 0.8;
            margin-right: 8px;
            margin-top: 5px;
        }

        /* ═══════════════════════════════════════════
           TIP SECTION
        ═══════════════════════════════════════════ */
        .tip-section {
            padding: 0;
            background: var(--primary-subtle);
            margin: 0 -16px;
        }
        .tip-accent-bar {
            height: 3px;
            background: linear-gradient(90deg, var(--primary), var(--accent));
        }
        .tip-inner { padding: 24px 20px 24px; }
        .tip-header {
            display: flex; align-items: center; gap: 10px;
            margin-bottom: 16px;
        }
        .tip-icon {
            width: 30px; height: 30px;
            border-radius: 8px;
            background: var(--primary-glow);
            display: flex; align-items: center; justify-content: center;
            font-size: 15px;
        }
        .tip-label {
            font-family: var(--font-title);
            font-size: 14px; font-weight: 700;
            color: var(--navy);
            letter-spacing: 0.3px;
        }
        .tip-label-accent { color: var(--primary); }
        .tip-text {
            font-family: var(--font-body);
            font-size: var(--font-size-base);
            color: var(--text-body);
            line-height: 1.32;
            padding-left: 16px;
            border-left: 3px solid var(--primary);
            text-align: left;
        }

        /* ═══════════════════════════════════════════
           IMAGES ACCORDION
        ═══════════════════════════════════════════ */
        .img-accordion { margin: 24px 0 0; }
        .img-toggle {
            width: 100%; background: none; border: none;
            padding: 0 0 16px;
            display: flex; align-items: center; justify-content: space-between;
            cursor: pointer;
        }
        .img-toggle-left { display: flex; align-items: center; gap: 10px; }
        .img-toggle-icon {
            width: 26px; height: 26px;
            border-radius: 7px; background: var(--primary-glow);
            display: flex; align-items: center; justify-content: center;
        }
        .img-toggle-icon svg { width: 14px; height: 14px; color: var(--primary); }
        .img-toggle-text {
            font-family: var(--font-title);
            font-size: 12px; font-weight: 600;
            color: var(--slate);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .img-toggle-count {
            font-family: var(--font-body);
            font-size: 11px; color: var(--text-muted);
            background: var(--border); padding: 2px 8px; border-radius: 10px;
        }
        .img-chevron {
            width: 18px; height: 18px;
            color: var(--text-muted);
            transition: transform 0.3s;
        }
        .img-accordion.open .img-chevron { transform: rotate(180deg); }
        .img-content {
            max-height: 0; overflow: hidden;
            transition: max-height 0.4s ease;
        }
        .img-accordion.open .img-content { max-height: 3000px; }
        .img-content img {
            width: 100%; border-radius: 10px;
            margin-bottom: 12px; cursor: pointer;
            -webkit-user-drag: none;
            transition: transform 0.2s;
        }
        .img-content img:active { transform: scale(0.98); }

        /* Lightbox */
        .lightbox {
            display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.92); z-index: 1000;
            align-items: center; justify-content: center; flex-direction: column;
            overflow: hidden; touch-action: none;
        }
        .lightbox.active { display: flex; }
        .lightbox img {
            max-width: 100%; max-height: 100%;
            object-fit: contain;
            transform-origin: center center;
            will-change: transform;
            -webkit-user-drag: none;
            transition: transform 0.18s ease-out;
        }
        .lightbox.dragging img { transition: none; }
        /* Botonera superior del visor */
        .lb-bar {
            position: absolute; top: 0; left: 0; right: 0;
            display: flex; align-items: center; justify-content: space-between;
            padding: 14px 16px; gap: 10px; z-index: 2;
            background: linear-gradient(180deg, rgba(0,0,0,0.55), transparent);
        }
        .lb-btn {
            width: 40px; height: 40px; border-radius: 50%;
            background: rgba(255,255,255,0.16); border: none;
            color: #fff; cursor: pointer; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
            -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
        }
        .lb-btn:active { background: rgba(255,255,255,0.3); }
        .lb-btn svg { width: 20px; height: 20px; }
        .lb-right { display: flex; gap: 10px; }
        .lb-zoom {
            font-family: var(--font-body); font-size: 12px; font-weight: 600;
            color: rgba(255,255,255,0.85); min-width: 46px; text-align: center;
        }
        .lightbox-hint {
            position: absolute; bottom: 22px; left: 0; right: 0; text-align: center;
            color: rgba(255,255,255,0.55); font-size: 12px; z-index: 2;
            font-family: var(--font-body); pointer-events: none;
            transition: opacity 0.25s;
        }
        .lightbox.zoomed .lightbox-hint { opacity: 0; }

        /* ═══════════════════════════════════════════
           BIBLIOGRAPHY
        ═══════════════════════════════════════════ */
        .bib-section { padding: 24px 0 0; }
        .bib-toggle {
            width: 100%; background: none; border: none;
            padding: 0 0 16px;
            display: flex; align-items: center; justify-content: space-between;
            cursor: pointer;
        }
        .bib-toggle-left { display: flex; align-items: center; gap: 10px; }
        .bib-toggle-num {
            font-family: var(--font-title);
            font-size: 13px; font-weight: 600;
            color: var(--primary);
            width: 26px; height: 26px;
            border-radius: 7px;
            background: var(--primary-glow);
            display: flex; align-items: center; justify-content: center;
        }
        .bib-toggle-text {
            font-family: var(--font-title);
            font-size: 12px; font-weight: 600;
            color: var(--slate);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .bib-chevron {
            width: 18px; height: 18px;
            color: var(--text-muted);
            transition: transform 0.3s;
        }
        .bib-section.open .bib-chevron { transform: rotate(180deg); }
        .bib-content {
            max-height: 0; overflow: hidden;
            transition: max-height 0.35s ease;
        }
        .bib-section.open .bib-content { max-height: 800px; }
        .bib-list { padding: 0 0 8px; }
        .bib-item {
            display: flex; gap: 10px; align-items: flex-start;
            padding: 10px 0;
            border-bottom: 1px solid rgba(226,232,240,0.5);
        }
        .bib-item:last-child { border-bottom: none; }
        .bib-num {
            font-family: var(--font-title);
            font-size: 12px; font-weight: 600;
            color: var(--primary);
            min-width: 16px; padding-top: 2px;
        }
        .bib-ref {
            font-family: var(--font-body);
            font-size: 13px; color: var(--slate);
            line-height: 1.55;
        }

        /* ═══════════════════════════════════════════
           FOOTER
        ═══════════════════════════════════════════ */
        .footer {
            margin-top: 28px;
            padding: 18px 0 8px;
            border-top: 1px solid var(--border);
            text-align: center;
        }
        .motivation {
            position: relative;
            margin-bottom: 14px;
            padding: 0 16px;
        }
        .motivation-icon {
            position: absolute;
            left: 2px; top: 0;
            font-size: 11px;
        }
        .motivation-text {
            font-family: var(--font-body);
            font-size: 12px;
            font-style: italic;
            color: var(--text-muted);
            line-height: 1.5;
            text-align: center;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .footer-logo { text-align: center; margin-bottom: 12px; }
        .footer-logo-text {
            font-family: var(--font-title);
            font-size: 13px; font-weight: 400;
            color: var(--text-muted);
            opacity: 0.45; letter-spacing: -0.3px;
        }
        .footer-social {
            display: flex; justify-content: center; gap: 20px;
            margin-bottom: 8px;
        }
        .footer-link {
            display: flex; align-items: center; gap: 5px;
            text-decoration: none;
            font-family: var(--font-title);
            font-size: 11px; font-weight: 500;
            color: var(--text-muted);
            transition: color 0.2s;
        }
        .footer-link:hover { color: var(--primary); }
        .footer-link svg { width: 14px; height: 14px; }
        .footer-copy {
            font-family: var(--font-title);
            font-size: 10px; color: var(--text-muted);
            opacity: 0.5; letter-spacing: 0.5px;
            margin-top: 4px;
        }

        /* ═══════════════════════════════════════════
           SCROLL TO TOP
        ═══════════════════════════════════════════ */
        .scroll-top {
            position: fixed;
            bottom: 20px; right: 16px;
            width: 38px; height: 38px;
            border-radius: 50%;
            background: var(--primary);
            border: none; color: #fff;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            box-shadow: 0 2px 12px rgba(24,130,140,0.3);
            opacity: 0; transform: translateY(10px);
            transition: opacity 0.3s, transform 0.3s;
            pointer-events: none; z-index: 40;
        }
        .scroll-top.visible { opacity: 1; transform: translateY(0); pointer-events: auto; }
        .scroll-top:active { transform: scale(0.92); }
        .scroll-top svg { width: 18px; height: 18px; }

        /* ═══════════════════════════════════════════
           BOTTOM BAR
        ═══════════════════════════════════════════ */
        .bottom-bar {
            position: fixed; bottom: 0; left: 0; right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--navy), var(--primary), var(--accent));
            z-index: 50;
        }

        /* ═══════════════════════════════════════════
           RESPONSIVE
        ═══════════════════════════════════════════ */
        @media (max-width: 420px) {
            /* el diagnostico es el protagonista: no se encoge en pantallas chicas */
            .answer-text { font-size: 20px; }
        }
        @media (min-width: 768px) {
            :root { --font-size-base: 17px; }
            .answer-text { font-size: 16px; }
            .tip-text { font-size: 17px; }
            .bib-ref { font-size: 14px; }
        }

        /* ═══════════════════════════════════════════════════════════════
           REDISEÑO 2026-08 — se añade al final para ganar por orden.
           Estructura tomada de la maqueta: encabezado con logotipo, titulo
           grande, tarjetas por opcion, TIP con su gradiente, FAB flotante.
           ═══════════════════════════════════════════════════════════════ */
        :root{ --base:16px; --ft:'Inter',-apple-system,BlinkMacSystemFont,sans-serif; }
        svg{display:block}
        /* .quien img{display:block} le ganaba a [hidden] y la imagen vacia se pintaba */
        [hidden]{display:none !important}

        /* ── Barra superior: logotipo completo y la foto de quien lee ── */
        .header{padding:16px 0 6px !important}
        .header-left{gap:8px !important}
        .header-birrete{width:26px !important;height:26px !important}
        .header-divider{display:none}
        .header-logo-text{font-family:var(--ft) !important;font-size:14.5px !important;
          font-weight:700 !important;letter-spacing:-0.02em !important;margin-top:0 !important}
        .header-case{display:none}
        .ctrl-btns{display:none !important}
        /* Solo aparece dentro de Telegram: fuera no hay usuario que mostrar. */
        /* Redondo, como los avatares de Telegram: cuadrado desentonaba al lado
           de la propia interfaz de la app. Es la unica excepcion a los
           cuadraditos, igual que el boton +. */
        .quien{width:34px;height:34px;border-radius:50%;overflow:hidden;flex-shrink:0;
          border:1px solid var(--border);
          background:color-mix(in srgb,var(--primary) 10%,transparent);
          display:flex;align-items:center;justify-content:center}
        .quien img{width:100%;height:100%;object-fit:cover}
        .quien-ini{font-family:var(--ft);font-size:12px;font-weight:700;color:var(--primary)}
        .divider--primary{display:none}

        /* ── Encabezado del caso ── */
        .chips{padding:16px 0 0 !important;gap:7px !important}
        .chip{font-family:var(--ft) !important;font-size:9.5px !important;
          letter-spacing:.5px !important;padding:6px 10px !important;
          border-radius:9px !important}
        .hero{padding:18px 0 6px !important}
        .eyebrow-row{display:none !important}
        .answer-section{margin:0 !important;padding:0 !important;border:none !important;
          background:none !important}
        .answer-text{font-family:var(--ft) !important;font-size:32px !important;
          font-weight:700 !important;letter-spacing:-0.032em !important;
          line-height:1.05 !important;color:var(--text) !important}
        .answer-label{font-family:var(--ft) !important;font-size:19px !important;
          font-weight:700 !important;letter-spacing:-0.018em !important;
          color:var(--primary) !important;text-transform:none !important;
          margin:9px 0 0 !important;order:2}
        .answer-section{display:flex;flex-direction:column}
        .answer-check{display:none !important}
        .divider{display:none}

        /* ── Titulo de seccion con chevron ── */
        .sec{display:flex;align-items:center;gap:5px;font-family:var(--ft);
          font-size:19px;font-weight:700;letter-spacing:-0.022em;margin:26px 0 12px;
          color:var(--text)}
        .sec svg{width:16px;height:16px;color:var(--text-muted)}

        /* ── Tarjeta de opcion ── */
        .opc{background:var(--bg);border:1px solid var(--border);border-radius:16px;
          margin-bottom:10px;padding:16px}
         /* Los tres elementos comparten eje: con titulos de dos lineas, tener la
           letra y la X ancladas arriba dejaba el texto colgando. */
        .opc-cab{display:flex;align-items:center;gap:11px;margin-bottom:10px}
        .opc-cab .fila-n{flex:1;font-family:var(--ft);font-size:16px;
          font-weight:600;letter-spacing:-0.01em;color:var(--text)}
        .fila-ico{width:30px;height:30px;border-radius:11px;flex-shrink:0;
          display:flex;align-items:center;justify-content:center;
          font-family:var(--ft);font-weight:700;font-size:14px}
        .fila-ico.ok{background:color-mix(in srgb,var(--primary) 18%,transparent);
          color:var(--primary)}
        .fila-ico.ok svg{width:17px;height:17px}
        .fila-ico.no{background:var(--border);color:var(--text-body)}
        .opc-est{width:26px;height:26px;border-radius:8px;flex-shrink:0;
          background:color-mix(in srgb,var(--accent) 12%,transparent);color:var(--accent);
          display:flex;align-items:center;justify-content:center}
        .opc-est svg{width:14px;height:14px}
        .ok-est{width:auto;height:auto;background:none;border-radius:0;
          font-family:var(--ft);font-size:12.5px;font-weight:700;color:var(--primary)}
        .opc>p{font-size:calc(var(--base) - 1.5px);color:var(--text-body);line-height:1.6}
        .opc>p+p{margin-top:13px}
        .opc>p b{color:var(--text);font-weight:600}
        .opc summary{cursor:pointer;list-style:none;margin-bottom:0;
          -webkit-tap-highlight-color:transparent}
        .opc summary::-webkit-details-marker{display:none}
        .opc[open] summary{margin-bottom:10px}
        .opc-flecha{width:17px;height:17px;color:var(--text-muted);flex-shrink:0;
          transition:transform .2s ease}
        .opc[open] .opc-flecha{transform:rotate(180deg)}

        /* ── TIP: burbuja con su gradiente teal→magenta ── */
        .tip-section{background:color-mix(in srgb,var(--primary) 4%,var(--bg)) !important;
          border:1px solid color-mix(in srgb,var(--primary) 20%,transparent);
          border-radius:16px !important;overflow:hidden;margin:22px 0 0 !important}
        .tip-inner{padding:16px !important}
        .tip-header{gap:10px !important;margin-bottom:13px !important}
        .tip-icon{border-radius:10px !important}
        .tip-label{font-family:var(--ft) !important}
        /* La linea se corre hacia el texto sin mover el texto: lo que baja es el
           hueco entre ambos (16 -> 9), y el margen devuelve esos 7 px para que el
           parrafo siga arrancando donde arrancaba. */
        .tip-text{font-size:calc(var(--base) - 1.5px) !important;line-height:1.55 !important;
          margin-left:7px !important;
          padding-left:9px !important;border-left:2px solid var(--primary) !important}

        /* ── Bibliografia y recurso: encabezado propio ── */
        .bib-section{padding:0 !important;margin-top:26px}
        .bib-toggle-num{font-family:var(--ft) !important;border-radius:7px !important}
        .img-accordion{margin:26px 0 0 !important}
        .img-content img{border-radius:16px}

        /* ── Pie: el birrete acompaña a la palabra ── */
        .footer-logo{display:flex;align-items:center;justify-content:center;gap:6px}
        .pie-birrete{width:16px;height:16px;display:block}
        .pie-birrete svg{width:100%;height:100%}
        [data-theme="dark"] .pie-birrete .brr-1{fill:#3FD3DB}
        [data-theme="dark"] .pie-birrete .brr-4{fill:#2AA3AC}
        [data-theme="dark"] .pie-birrete .brr-2{fill:#1F7C85}
        [data-theme="dark"] .pie-birrete .brr-3{fill:#1A6B72}
        .footer-logo-text{font-family:var(--ft) !important;font-weight:600 !important}

        /* ── FAB: un boton, dos funciones ──
           Arriba de la pagina es el + que despliega Aa y el tema; al bajar se
           convierte en flecha y sube. Las caras se cruzan girando. */
        .scroll-top{display:none !important}
        .fab{position:fixed;right:16px;bottom:calc(18px + env(safe-area-inset-bottom));
          display:flex;flex-direction:column;align-items:center;gap:10px;z-index:50}
        .fab button{cursor:pointer;font-family:var(--ft);border-radius:14px;
          display:flex;align-items:center;justify-content:center;
          -webkit-tap-highlight-color:transparent;
          background:color-mix(in srgb,var(--bg) 70%,transparent);
          -webkit-backdrop-filter:blur(22px) saturate(180%);
          backdrop-filter:blur(22px) saturate(180%);
          border:1px solid var(--border);
          box-shadow:0 6px 20px rgba(15,23,42,.13), 0 1px 2px rgba(15,23,42,.06)}
        [data-theme="dark"] .fab button{background:rgba(40,40,40,.7);border-color:#3a3a3a;
          box-shadow:0 6px 22px rgba(0,0,0,.6)}
        .fab svg{width:20px;height:20px}
        .fab-op{width:42px;height:42px;color:var(--text);font-size:13px;font-weight:600;
          opacity:0;transform:translateY(16px) scale(.72);pointer-events:none;
          transition:opacity .2s ease, transform .34s cubic-bezier(.34,1.56,.64,1)}
        .fab.abierto .fab-op{opacity:1;transform:none;pointer-events:auto;
          transition-delay:calc(var(--i) * 45ms - 45ms)}
        .fab-op.activo{color:var(--primary);border-color:var(--primary)}
        .fab .fab-mas{width:52px;height:52px;color:var(--text);border-radius:50%;
          position:relative}
        .fab-mas .cara{position:absolute;
          transition:opacity .15s ease, transform .26s cubic-bezier(.4,0,1,1)}
        .fab-mas .cara-sube{opacity:0;transform:rotate(-100deg) scale(.55)}
        .fab.abajo .cara-mas{opacity:0;transform:rotate(100deg) scale(.55)}
        .fab.abajo .cara-sube{opacity:1;transform:none;
          transition:opacity .22s ease .06s, transform .44s cubic-bezier(.34,1.6,.5,1) .04s}
        .fab.abierto .cara-mas{opacity:1;transform:rotate(135deg);
          transition:transform .4s cubic-bezier(.34,1.6,.5,1)}
        .fab.abierto .cara-sube{opacity:0;transform:rotate(-100deg) scale(.55)}
        .fab.abajo .fab-mas{animation:resorte .44s cubic-bezier(.34,1.6,.5,1)}
        @keyframes resorte{0%{transform:scale(1)}40%{transform:scale(.86)}100%{transform:scale(1)}}
        @media (prefers-reduced-motion:reduce){
          .fab-op,.fab-mas .cara{transition:opacity .15s ease}
          .fab.abierto .fab-op{transform:none}
          .fab.abajo .fab-mas{animation:none}
        }
        body{padding-bottom:86px}
        /* Cuando el caso no trae etiquetas, el aire que estas ocupaban quedaba
           igual y abria un vacio entre el titulo y "La correcta". */
        /* El hueco muerto estaba entre "Respuesta correcta" y "La correcta", no
           entre la barra y el titulo: quitarlo de arriba dejaba el encabezado
           amontonado contra el logotipo. Se recorta abajo y se respeta arriba. */
        .hero.sin-chips{padding-top:18px !important;padding-bottom:4px !important}
        /* en modo tarjetas el bloque de texto corrido queda vacio: seguia
           ocupando su padding y alargaba el hueco */
        .justification-section:empty,
        .justification-section:has(> .justification:empty){display:none}
        .hero + .sec,.justification-section + .sec{margin-top:22px}
        .justification p:first-child::first-letter{
          font-size:inherit !important;color:inherit !important;font-weight:inherit !important;
          float:none !important;line-height:inherit !important;margin:0 !important;
          font-family:inherit !important}
    </style>
</head>
<body>
    <div class="app" id="appContainer">
        <div id="content">
            <div class="loading-container">
                <div class="spinner"></div>
                <div class="loading-text"><div style="font-size:28px;margin-bottom:6px;">🎓</div>Cargando caso clínico...</div>
            </div>
        </div>
    </div>
    <button class="scroll-top" id="scrollTop"><svg viewBox="0 0 256 256" fill="currentColor" xmlns="http://www.w3.org/2000/svg"><path d="M205.66,117.66a8,8,0,0,1-11.32,0L136,59.31V216a8,8,0,0,1-16,0V59.31L61.66,117.66a8,8,0,0,1-11.32-11.32l72-72a8,8,0,0,1,11.32,0l72,72A8,8,0,0,1,205.66,117.66Z"/></svg></button>
    <div class="bottom-bar"></div>

    <script>
        // ─── Theme: sun/moon toggle (starts from system preference) ───
        const themeMql = window.matchMedia('(prefers-color-scheme: dark)');
        let savedTheme = null;
        try { savedTheme = localStorage.getItem('acamedics-theme'); } catch(e) {}

        function applyTheme(theme) {
            if (theme === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
            } else {
                document.documentElement.removeAttribute('data-theme');
            }
        }
        function getEffective() {
            if (savedTheme) return savedTheme;
            return themeMql.matches ? 'dark' : 'light';
        }
        themeMql.addEventListener('change', () => {
            if (!savedTheme) applyTheme(themeMql.matches ? 'dark' : 'light');
        });
        applyTheme(getEffective());

        let tg = null;
        try {
            tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
            if (tg) { tg.ready(); tg.expand(); if (tg.disableVerticalSwipes) tg.disableVerticalSwipes(); }
        } catch(e) { console.warn('Telegram WebApp SDK not available'); }
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('selectstart', e => e.preventDefault());
        document.addEventListener('dragstart', e => e.preventDefault());

        const contentDiv = document.getElementById('content');

        // ─── Haptic feedback ───
        function haptic(style) {
            try {
                if (tg && tg.HapticFeedback) {
                    tg.HapticFeedback.impactOccurred(style || 'light');
                    return;
                }
            } catch(e) {}
            try { navigator.vibrate && navigator.vibrate(style === 'medium' ? 15 : 8); } catch(e) {}
        }

        // ─── Motivational phrases ───
        const phrases = [
            // ── Clásicos verificados ──
            { text: "El médico que solo sabe de medicina, ni de medicina sabe.", author: "José de Letamendi" },
            { text: "La medicina es la ciencia de la incertidumbre y el arte de la probabilidad.", author: "William Osler" },
            { text: "Donde quiera que se ama el arte de la medicina, se ama también a la humanidad.", author: "Platón" },
            { text: "El buen médico trata la enfermedad; el gran médico trata al paciente que tiene la enfermedad.", author: "William Osler" },
            { text: "La paciencia es la mejor medicina.", author: "John Florio" },
            { text: "El acto médico es un acto de amor.", author: "Gregorio Marañón" },
            { text: "El médico competente, antes de dar una medicina, primero diagnostica la enfermedad.", author: "Cicerón" },
            { text: "La función del médico es entretener al paciente mientras la naturaleza cura la enfermedad.", author: "Voltaire" },
            { text: "La excelencia no es un acto, sino un hábito.", author: "Aristóteles" },
            { text: "Curar a veces, aliviar con frecuencia, consolar siempre.", author: "Hipócrates" },
            { text: "La vida es breve, el arte largo, la ocasión fugaz, la experiencia engañosa, el juicio difícil.", author: "Hipócrates" },
            { text: "No hay enfermedades, sino enfermos.", author: "Gregorio Marañón" },
            { text: "El secreto de la atención del paciente está en interesarse por el paciente.", author: "Francis Peabody" },
            { text: "La medicina es una ciencia social, y la política no es más que medicina a gran escala.", author: "Rudolf Virchow" },
            { text: "Escucha al paciente; él te está diciendo el diagnóstico.", author: "William Osler" },
            { text: "El que estudia la medicina sin los libros navega sin brújula; pero el que la estudia sin pacientes no navega.", author: "William Osler" },
            { text: "La primera obligación del médico es educar a las masas para que no necesiten de él.", author: "Santiago Ramón y Cajal" },
            { text: "Todo hombre puede ser, si se lo propone, escultor de su propio cerebro.", author: "Santiago Ramón y Cajal" },
            { text: "No hay hechos pequeños. Lo que llamamos pequeño es simplemente algo que no entendemos.", author: "Santiago Ramón y Cajal" },
            { text: "La clínica es soberana.", author: "Aforismo médico" },
            { text: "Primum non nocere: ante todo, no hacer daño.", author: "Principio hipocrático" },
            { text: "Un médico que no tiene nada que hacer con su cabeza recurre a sus manos.", author: "Abraham Verghese" },
            { text: "En nada se parece tanto el médico a Dios como en el deseo de ayudar al prójimo.", author: "Maimónides" },
            { text: "Quien salva una vida, salva al mundo entero.", author: "Talmud" },
            { text: "Los médicos no solo deben conocer la enfermedad, sino también al ser humano.", author: "Rudolf Virchow" },
            { text: "La medicina no es solo una ciencia, es también un arte. No se trata solo de pastillas y pociones.", author: "Paracelso" },
            { text: "El investigador sufre las decepciones, los largos meses pasados en una dirección equivocada, pero llega.", author: "Santiago Ramón y Cajal" },
            { text: "Siempre que enseñes, enseña también a dudar de lo que enseñas.", author: "José Ortega y Gasset" },
            // ── Motivacionales para el estudio ──
            { text: "Estudia, porque el día menos pensado alguien dependerá de lo que tú sabes.", author: "Anónimo" },
            { text: "No estudies para aprobar. Estudia para saber. Y cuando sepas, no podrás reprobar.", author: "Anónimo" },
            { text: "Cada paciente que atiendes es un libro que te enseña algo nuevo.", author: "Anónimo" },
            { text: "El éxito en medicina se construye caso a caso, día a día.", author: "Anónimo" }
        ];
        function getPhrase() { return phrases[Math.floor(Math.random() * phrases.length)]; }

        // ─── Utility functions ───
        function stripBibPrefix(t) { return t.replace(/^\s*(\d+[\.\)\-\]]\s*|\[\d+\]\s*|-\s*|•\s*|–\s*|►\s*|>\s*)/,'').trim(); }

        // ── Filtros de bibliografia ──────────────────────────────────────
        // Descartan lo que NO es una referencia real. Actuan al mostrar, asi que
        // tambien corrigen casos ya publicados sin tener que volver a subirlos.

        // 1) Encabezados de seccion que se cuelan como si fueran una referencia
        const BIB_ENCABEZADOS = /^(bibliograf[ií]a|referencias?(\s+bibliogr[aá]ficas?)?|fuentes?|citas?(\s+bibliogr[aá]ficas?)?|lecturas?\s+recomendadas?|material\s+de\s+consulta|bibliography|references?|sources?|refs?)\s*:?\s*$/i;

        // 2) Bancos de preguntas que NO deben aparecer citados (regla ACAMEDICS)
        const BIB_PROHIBIDAS = /\b(amboss|uworld|nbme|usmle[\s-]*rx|usmle|quesmed|kaplan|osmosis|lecturio|truelearn|archer\s+review|mir\b|enarm)\b/i;

        function esReferenciaValida(s) {
            const t = (s || '').trim();
            if (t.length < 12) return false;
            if (BIB_ENCABEZADOS.test(t)) return false;          // "BIBLIOGRAFÍA" sola
            if (BIB_PROHIBIDAS.test(t)) return false;           // AMBOSS, UWorld, etc.
            if (/^tip\s+acam[eé]dico/i.test(t)) return false;   // el TIP mal ubicado
            if (t.includes('**')) return false;                 // prosa con negritas: es justificacion, no referencia
            return true;
        }

        // ── Rescate de contenido mal ubicado ─────────────────────────────
        // Cuando un caso llega mal partido (le pasa a los largos enviados por
        // Telegram), parte de la justificacion y el TIP terminan guardados dentro
        // de la bibliografia. NO se descartan: se devuelven a su sitio, porque son
        // texto que el autor escribio y el estudiante debe leer.
        function rescatarContenido(d) {
            const bruto = [];
            const b = d && d.bibliography;
            if (Array.isArray(b)) b.forEach(x => { if (typeof x === 'string') x.split('\n').forEach(l => bruto.push(l)); });
            else if (typeof b === 'string') b.split('\n').forEach(l => bruto.push(l));
            else return d;

            const prosa = [], tips = [];
            bruto.forEach(linea => {
                const t = (linea || '').trim();
                if (t.length < 12) return;
                if (/^tip\s+acam[eé]dico/i.test(t)) { tips.push(t.replace(/^tip\s+acam[eé]dico\s*:?\s*/i, '')); return; }
                // parrafo de justificacion: lleva negritas y no parece una cita
                if (t.includes('**') && !/doi:|https?:\/\//i.test(t)) prosa.push(t);
            });
            if (!prosa.length && !tips.length) return d;

            const copia = Object.assign({}, d);
            if (prosa.length) copia.justification = (copia.justification || '').trimEnd() + '\n\n' + prosa.join('\n\n');
            if (tips.length && !(copia.tip || '').trim()) copia.tip = tips.join(' ');
            return copia;
        }

        function parseBibliography(bib) {
            let bruto = [];
            if (Array.isArray(bib) && bib.length > 0) {
                if (bib.length === 1 && bib[0].includes('\n')) {
                    bruto = bib[0].split('\n');
                } else {
                    bib.forEach(item => {
                        if (typeof item !== 'string') return;
                        if (item.includes('\n')) item.split('\n').forEach(s => bruto.push(s));
                        else bruto.push(item);
                    });
                }
            } else if (typeof bib === 'string') {
                bruto = bib.split('\n');
            }
            return bruto.map(s => (s || '').trim()).filter(esReferenciaValida);

        function esc(s) { if (!s) return ''; const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
        function mdBold(s) {
            // Fix misplaced bold markers: letter**rest** → **letter rest**
            // Catches 1-3 letters before ** that should be inside the bold
            s = s.replace(/(^|[\s(,;:])([a-zA-ZáéíóúñüÁÉÍÓÚÑÜ]{1,3})\*\*([^\*]+?)\*\*/g, '$1**$2$3**');
            // Convert **text** to <b>text</b> AFTER esc() so it's safe
            // Also convert *text* (single) to <i>text</i> for italic
            return s
                .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
                .replace(/(?<!\*)\*(?!\*)(.+?)(?<!\*)\*(?!\*)/g, '<i>$1</i>');
        }

            if (!uuid) return 1000;
            let hash = 0;
            for (let i = 0; i < uuid.length; i++) {
                hash = ((hash << 5) - hash) + uuid.charCodeAt(i);
                hash |= 0;
            }
            return 1000 + (Math.abs(hash) % 2001); // 1000–3000
        }

                justText = justText.replace(/\n\s*([A-Fa-f][.)]\s+[a-záéíóúñ])/g, ' $1');
                justText = justText.replace(/\n\s*(\(?[A-Fa-f][.)]\)?)\s*\n/g, ' $1 ');

                const hasDoubleNL = /\n\s*\n/.test(justText);

                const esTituloOtras = t =>

                const cuerpos = paras.map(fusion);
                const corte = cuerpos.findIndex(t => esTituloOtras(t) || esRaya(t) || abreDescarte(t));

                function soloPrimeraNegrita(t){
                    let primera = true;
                    return mdBold(esc(t)).replace(/<b>([\s\S]*?)<\/b>/g, (m, dentro) => {

                if (corte === -1) {

                    html += '<div class="sec">La correcta'

                    html += '<div class="opc">';

                    // Los descartes: uno por parrafo, en el orden en que vienen
                    const resto = cuerpos.slice(corte).filter(t => !esTituloOtras(t) && !esRaya(t));

                        const malas = ops.filter(o => (o.letter||'').toUpperCase() !== letraOk);
                        resto.forEach((t, i) => {

                            // La letra sale de la opcion cuando el parrafo la nombra al

                            // La letra sale, por orden de fiabilidad:
                            //   1. "(opcion A)" dentro del parrafo — explicita, no depende
                            //      del orden en que vengan los descartes
                            //   2. "**B. Nombre**" al abrir el parrafo (formato anterior)
                            //   3. el orden de la lista de opciones (ultimo recurso)
                            // Se acepta "(opcion B)" y tambien "la opcion B" suelta:
                            // varios casos ya publicados usan la segunda, y adaptar

                            const mParen = t.match(/\(\s*opci[oó]n\s+([A-F])\s*\)/i)

                            const mAbre  = t.match(/^\*\*\s*([A-F])[.)]\s*([^*]+?)\s*\*\*/);
                            let letra, nombre, texto = t;
                            if (mParen) {
                                letra = mParen[1].toUpperCase();
                                const op = ops.find(x => (x.letter||'').toUpperCase() === letra);
                                nombre = op ? (op.text||'') : '';
                                // el "(opcion A)" era para mi, no para quien lee
                                // si la marca era "la opcion B", se quita entera
                                texto = t.replace(mParen[0], '').replace(/\s{2,}/g, ' ')
                                         .replace(/\s+([,.;:])/g, '$1').trim();
                            } else if (mAbre) {
                                letra = mAbre[1]; nombre = mAbre[2];
                                texto = t.replace(mAbre[0], '').replace(/^[\s.:—–-]+/, '');

                            html += '<details class="opc"><summary class="opc-cab">'

            // ── IMAGES ACCORDION ──
            const caseImages = (Array.isArray(d.images) ? d.images : []).filter(url => !vignetteImages.some(a => a.url === url));

            scrollBtn.classList.toggle('visible', window.scrollY > 400);
        }, { passive: true });
        scrollBtn.addEventListener('click', () => {
            haptic('light');
            window.scrollTo({top: 0, behavior: 'smooth'});
        });

        function showError(m) {
            contentDiv.innerHTML = '<div class="error-container"><div class="error-icon">⚠️</div><div class="error-text">'+m+'</div><button class="retry-btn" onclick="location.reload()">Reintentar</button></div>';
        }

        loadCase();
    </script>
</body>
</html>
